<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Project Forge 2D</title>
    <style>
        :root {
            --glass-bg: rgba(20, 20, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #ffd700;
            --text-color: #ffffff;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d0e15;
            font-family: var(--font-family);
            color: var(--text-color);
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* HUD & Overlay Container */
        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .interactive-ui {
            pointer-events: auto;
        }

        /* Top Bar */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            padding: 12px;
        }

        .hud-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 14px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        #performance-monitor {
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            color: #a0a5c0;
        }
        #performance-monitor span {
            color: var(--accent-color);
        }

        #game-controls {
            display: flex;
            gap: 8px;
        }

        .hud-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 10px 16px;
            min-height: 44px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
        }
        .hud-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Middle Overlay (e.g. Instructions/Tutorial) */
        #tutorial-overlay {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1.5s ease-out;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }
        #tutorial-overlay h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #tutorial-overlay p {
            margin: 0;
            font-size: 14px;
            color: #ccc;
        }

        /* Bottom Bar */
        #bottom-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-bottom: 16px;
            gap: 12px;
        }

        /* Hotbar Inventory */
        #hotbar {
            display: flex;
            gap: 6px;
            background: rgba(10, 10, 15, 0.8);
            border: 2px solid var(--glass-border);
            padding: 6px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hotbar-slot {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, border-color 0.15s;
        }
        .hotbar-slot:active {
            transform: scale(0.9);
        }
        .hotbar-slot.selected {
            border-color: var(--accent-color);
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .hotbar-slot canvas {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        .slot-name {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #aaa;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .hotbar-slot.selected .slot-name {
            opacity: 1;
        }

        /* Mobile specific layouts */
        @media (max-width: 768px) {
            #tutorial-overlay h1 {
                font-size: 22px;
            }
            #tutorial-overlay p {
                font-size: 12px;
            }
            .hotbar-slot {
                width: 40px;
                height: 40px;
            }
            .hotbar-slot canvas {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud-container">
        <!-- Top HUD -->
        <div id="top-bar" class="interactive-ui">
            <div id="performance-monitor" class="hud-panel">
                FPS: <span id="val-fps">0</span> | Update: <span id="val-up">0ms</span> | Render: <span id="val-ren">0ms</span><br>
                Pos: X <span id="val-x">0</span> Y <span id="val-y">0</span> | Chunks: <span id="val-chunks">0</span><br>
                Bloques: Activos <span id="val-blocks">0</span>
            </div>
            <div id="game-controls">
                <button class="hud-btn" id="btn-sound">🔊 Sonido</button>
                <button class="hud-btn" id="btn-reset">🌀 Teleport</button>
            </div>
        </div>

        <!-- Middle Help (Fades out after 6 seconds) -->
        <div id="tutorial-overlay">
            <h1>Project Forge 2D</h1>
            <p>🕹️ Joystick izquierdo para moverte • 🔨 Toca para minar/construir</p>
        </div>

        <!-- Bottom HUD -->
        <div id="bottom-bar" class="interactive-ui">
            <!-- Inventory Selector -->
            <div id="hotbar">
                <!-- Will be dynamically populated -->
            </div>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // 1. CONFIG & SYSTEM CONSTANTS
        // ==========================================
        const BLOCK_SIZE = 32;
        const CHUNK_SIZE = 16;
        const GRAVITY = 1000;
        const FRICTION = 0.25; // Exp factor
        const WALK_ACCEL = 600;
        const JUMP_FORCE = -400;
        const MAX_FALL_SPEED = 600;
        const WORLD_HEIGHT_CHUNKS = 8; // 128 blocks high
        const WORLD_WIDTH_CHUNKS = 16; // 256 blocks wide
        const INTERACTION_RANGE = 5 * BLOCK_SIZE;

        // Block Definitions
        const BLOCKS = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            COAL: 4,
            IRON: 5,
            WOOD: 6,
            LEAVES: 7,
            GLASS: 8,
            SAND: 9,
            WATER: 10,
            BEDROCK: 11
        };

        const BLOCK_INFO = {
            [BLOCKS.AIR]: { name: "Aire", solid: false, hardness: 0, color: "transparent" },
            [BLOCKS.GRASS]: { name: "Hierba", solid: true, hardness: 0.8, color: "hsl(100, 60%, 40%)" },
            [BLOCKS.DIRT]: { name: "Tierra", solid: true, hardness: 0.6, color: "hsl(25, 40%, 30%)" },
            [BLOCKS.STONE]: { name: "Piedra", solid: true, hardness: 2.0, color: "hsl(0, 0%, 50%)" },
            [BLOCKS.COAL]: { name: "Carbón", solid: true, hardness: 2.2, color: "hsl(0, 0%, 20%)" },
            [BLOCKS.IRON]: { name: "Hierro", solid: true, hardness: 3.0, color: "hsl(25, 30%, 65%)" },
            [BLOCKS.WOOD]: { name: "Madera", solid: true, hardness: 1.2, color: "hsl(35, 50%, 35%)" },
            [BLOCKS.LEAVES]: { name: "Hojas", solid: false, hardness: 0.2, color: "rgba(34, 139, 34, 0.8)" },
            [BLOCKS.GLASS]: { name: "Cristal", solid: true, hardness: 0.4, color: "rgba(220, 240, 255, 0.4)", transparent: true },
            [BLOCKS.SAND]: { name: "Arena", solid: true, hardness: 0.5, color: "hsl(45, 60%, 75%)", sandPhysics: true },
            [BLOCKS.WATER]: { name: "Agua", solid: false, hardness: 0.1, color: "rgba(30, 100, 220, 0.6)", fluid: true },
            [BLOCKS.BEDROCK]: { name: "Roca Base", solid: true, hardness: Infinity, color: "hsl(0, 0%, 15%)" }
        };

        const SKY_COLORS = {
            NIGHT_TOP: { r: 13, g: 14, b: 21 },
            NIGHT_BOT: { r: 5, g: 5, b: 8 },
            DAY_TOP: { r: 135, g: 206, b: 235 },
            DAY_BOT: { r: 224, g: 246, b: 255 },
            SUNRISE_TOP: { r: 26, g: 15, b: 35 },
            SUNRISE_BOT: { r: 255, g: 140, b: 0 },
            SUNSET_TOP: { r: 18, g: 16, b: 32 },
            SUNSET_BOT: { r: 211, g: 84, b: 0 }
        };

        // ==========================================
        // 2. PRNG & NOISE GENERATOR (DETERMINISTIC)
        // ==========================================
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
        }

        class Noise2D {
            constructor(seed) {
                this.seed = seed;
                this.p = new Uint8Array(256 * 2);
                const rand = mulberry32(seed);
                for (let i = 0; i < 256; i++) {
                    this.p[i] = i;
                }
                for (let i = 0; i < 256; i++) {
                    const j = Math.floor(rand() * 256);
                    const tmp = this.p[i];
                    this.p[i] = this.p[j];
                    this.p[j] = tmp;
                }
                for (let i = 0; i < 256; i++) {
                    this.p[256 + i] = this.p[i];
                }
            }

            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y) {
                const h = hash & 7;
                const u = h < 4 ? x : y;
                const v = h < 4 ? y : x;
                return ((h & 1) ? -u : u) + ((h & 2) ? -2.0 * v : 2.0 * v);
            }

            noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = this.fade(x);
                const v = this.fade(y);
                const A = this.p[X] + Y;
                const B = this.p[X + 1] + Y;

                return this.lerp(v,
                    this.lerp(u, this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y)),
                    this.lerp(u, this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1))
                );
            }
        }

        // ==========================================
        // 3. SOUND SYNTHESIZER (WEB AUDIO API)
        // ==========================================
        class SoundSynth {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (this.muted) return;
                this.init();
                if (this.ctx.state === "suspended") this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = "sine";
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.12);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);

                osc.start(now);
                osc.stop(now + 0.12);
            }

            playStep() {
                if (this.muted) return;
                this.init();
                if (this.ctx.state === "suspended") this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = "triangle";
                osc.frequency.setValueAtTime(60, now);
                osc.frequency.setValueAtTime(40, now + 0.04);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);

                osc.start(now);
                osc.stop(now + 0.05);
            }

            playMine() {
                if (this.muted) return;
                this.init();
                if (this.ctx.state === "suspended") this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(90 + Math.random() * 30, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.07);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.07);

                osc.start(now);
                osc.stop(now + 0.07);
            }

            playBreak() {
                if (this.muted) return;
                this.init();
                if (this.ctx.state === "suspended") this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.type = "sawtooth";
                osc1.frequency.setValueAtTime(110, now);
                osc1.frequency.linearRampToValueAtTime(20, now + 0.15);

                osc2.type = "triangle";
                osc2.frequency.setValueAtTime(70, now);
                osc2.frequency.linearRampToValueAtTime(10, now + 0.15);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.15);
                osc2.stop(now + 0.15);
            }

            playPlace() {
                if (this.muted) return;
                this.init();
                if (this.ctx.state === "suspended") this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = "sine";
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(95, now + 0.08);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);

                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        const audio = new SoundSynth();

        // ==========================================
        // 4. PROCEDURAL TEXTURES (OFFSCREEN CANVASES)
        // ==========================================
        const Textures = {};
        function generateTextures() {
            Object.keys(BLOCKS).forEach(key => {
                const id = BLOCKS[key];
                const info = BLOCK_INFO[id];
                const canvas = document.createElement("canvas");
                canvas.width = BLOCK_SIZE;
                canvas.height = BLOCK_SIZE;
                const ctx = canvas.getContext("2d");

                if (id === BLOCKS.AIR) {
                    Textures[id] = canvas;
                    return;
                }

                // Base Fill
                ctx.fillStyle = info.color;
                ctx.fillRect(0, 0, BLOCK_SIZE, BLOCK_SIZE);

                // Add Noise & Detailing to simulate high-fidelity offline pixel art
                const rand = mulberry32(id * 99 + 42);

                if (id === BLOCKS.GRASS) {
                    // Grass Blade details
                    ctx.fillStyle = "hsl(100, 65%, 45%)";
                    for (let x = 0; x < BLOCK_SIZE; x += 4) {
                        const h = 4 + Math.floor(rand() * 8);
                        ctx.fillRect(x, 0, 3, h);
                    }
                    ctx.fillStyle = "hsl(25, 40%, 25%)"; // Bottom dirt line
                    ctx.fillRect(0, BLOCK_SIZE - 6, BLOCK_SIZE, 6);
                } else if (id === BLOCKS.DIRT) {
                    ctx.fillStyle = "hsl(25, 38%, 26%)";
                    for (let i = 0; i < 16; i++) {
                        ctx.fillRect(rand() * (BLOCK_SIZE - 4), rand() * (BLOCK_SIZE - 4), 3, 3);
                    }
                } else if (id === BLOCKS.STONE) {
                    ctx.fillStyle = "hsl(0, 0%, 45%)";
                    for (let i = 0; i < 10; i++) {
                        ctx.fillRect(rand() * (BLOCK_SIZE - 6), rand() * (BLOCK_SIZE - 6), 5, 2);
                    }
                    // Border shadow
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.2)";
                    ctx.strokeRect(0.5, 0.5, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                } else if (id === BLOCKS.COAL) {
                    ctx.fillStyle = "hsl(0, 0%, 15%)";
                    for (let i = 0; i < 6; i++) {
                        ctx.fillRect(2 + rand() * (BLOCK_SIZE - 8), 2 + rand() * (BLOCK_SIZE - 8), 4, 4);
                    }
                } else if (id === BLOCKS.IRON) {
                    ctx.fillStyle = "hsl(25, 45%, 60%)";
                    for (let i = 0; i < 6; i++) {
                        ctx.fillRect(2 + rand() * (BLOCK_SIZE - 8), 2 + rand() * (BLOCK_SIZE - 8), 4, 4);
                    }
                } else if (id === BLOCKS.WOOD) {
                    ctx.fillStyle = "hsl(35, 52%, 28%)";
                    ctx.fillRect(0, 0, BLOCK_SIZE, BLOCK_SIZE);
                    ctx.fillStyle = "hsl(35, 48%, 38%)";
                    ctx.fillRect(4, 0, BLOCK_SIZE - 8, BLOCK_SIZE);
                    ctx.fillRect(0, 8, BLOCK_SIZE, 4);
                    ctx.fillRect(0, 20, BLOCK_SIZE, 4);
                } else if (id === BLOCKS.LEAVES) {
                    ctx.fillStyle = "rgba(25, 110, 25, 0.9)";
                    for (let i = 0; i < 20; i++) {
                        ctx.beginPath();
                        ctx.arc(rand() * BLOCK_SIZE, rand() * BLOCK_SIZE, 4 + rand() * 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (id === BLOCKS.GLASS) {
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.lineTo(BLOCK_SIZE, BLOCK_SIZE);
                    ctx.moveTo(0, BLOCK_SIZE - 8); ctx.lineTo(8, BLOCK_SIZE);
                    ctx.stroke();
                } else if (id === BLOCKS.SAND) {
                    ctx.fillStyle = "hsl(45, 60%, 70%)";
                    for (let i = 0; i < 20; i++) {
                        ctx.fillRect(rand() * BLOCK_SIZE, rand() * BLOCK_SIZE, 2, 2);
                    }
                } else if (id === BLOCKS.WATER) {
                    // Transparent blue wave pre-render
                    ctx.fillStyle = "rgba(30, 110, 230, 0.7)";
                    ctx.fillRect(0, 0, BLOCK_SIZE, BLOCK_SIZE);
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
                    ctx.beginPath();
                    ctx.moveTo(0, 4); ctx.lineTo(BLOCK_SIZE, 4);
                    ctx.stroke();
                } else if (id === BLOCKS.BEDROCK) {
                    ctx.fillStyle = "hsl(0, 0%, 10%)";
                    ctx.fillRect(0, 0, BLOCK_SIZE, BLOCK_SIZE);
                    ctx.fillStyle = "hsl(0, 0%, 20%)";
                    for (let i = 0; i < 30; i++) {
                        ctx.fillRect(rand() * BLOCK_SIZE, rand() * BLOCK_SIZE, 2, 2);
                    }
                }

                Textures[id] = canvas;
            });
        }

        // ==========================================
        // 5. WORLD DATA & GENERATION SYSTEM
        // ==========================================
        class World {
            constructor(widthChunks, heightChunks) {
                this.widthChunks = widthChunks;
                this.heightChunks = heightChunks;
                this.width = widthChunks * CHUNK_SIZE;
                this.height = heightChunks * CHUNK_SIZE;
                
                this.grid = Array(this.width).fill(null).map(() => Array(this.height).fill(BLOCKS.AIR));
                this.noiseGen = new Noise2D(2026);
                
                this.generate();
            }

            generate() {
                for (let x = 0; x < this.width; x++) {
                    const surfaceNoise = this.noiseGen.noise(x * 0.02, 0) * 16 + this.noiseGen.noise(x * 0.08, 100) * 4;
                    const surfaceY = Math.floor(this.height / 2) + Math.floor(surfaceNoise);
                    
                    for (let y = 0; y < this.height; y++) {
                        if (y > this.height - 3) {
                            this.grid[x][y] = BLOCKS.BEDROCK;
                        } else if (y > surfaceY + 8) {
                            const caveNoise = this.noiseGen.noise(x * 0.08, y * 0.08);
                            if (caveNoise < -0.35) {
                                this.grid[x][y] = BLOCKS.AIR;
                            } else {
                                const mineralNoise = this.noiseGen.noise(x * 0.15, y * 0.15);
                                if (mineralNoise > 0.4) {
                                    this.grid[x][y] = BLOCKS.IRON;
                                } else if (mineralNoise < -0.4) {
                                    this.grid[x][y] = BLOCKS.COAL;
                                } else {
                                    this.grid[x][y] = BLOCKS.STONE;
                                }
                            }
                        } else if (y > surfaceY) {
                            this.grid[x][y] = BLOCKS.DIRT;
                        } else if (y === surfaceY) {
                            this.grid[x][y] = BLOCKS.GRASS;
                        }
                    }
                }

                const rand = mulberry32(1005);
                for (let x = 4; x < this.width - 4; x++) {
                    const surfaceY = this.getSurfaceY(x);
                    if (this.grid[x][surfaceY] === BLOCKS.GRASS) {
                        if (rand() < 0.12 && this.getSurfaceY(x - 1) === surfaceY && this.getSurfaceY(x + 1) === surfaceY) {
                            const trunkHeight = 4 + Math.floor(rand() * 3);
                            for (let th = 1; th <= trunkHeight; th++) {
                                this.grid[x][surfaceY - th] = BLOCKS.WOOD;
                            }
                            const crownY = surfaceY - trunkHeight;
                            for (let lx = -2; lx <= 2; lx++) {
                                for (let ly = -2; ly <= 1; ly++) {
                                    const tx = x + lx;
                                    const ty = crownY + ly;
                                    if (tx >= 0 && tx < this.width && ty >= 0 && ty < this.height) {
                                        if (this.grid[tx][ty] === BLOCKS.AIR) {
                                            this.grid[tx][ty] = BLOCKS.LEAVES;
                                        }
                                    }
                                }
                            }
                            x += 3;
                        }
                    }
                }
            }

            getSurfaceY(x) {
                if (x < 0 || x >= this.width) return 0;
                for (let y = 0; y < this.height; y++) {
                    if (this.grid[x][y] !== BLOCKS.AIR && BLOCK_INFO[this.grid[x][y]].solid) {
                        return y;
                    }
                }
                return this.height - 1;
            }

            isValid(x, y) {
                return x >= 0 && x < this.width && y >= 0 && y < this.height;
            }

            isSolid(x, y) {
                if (!this.isValid(x, y)) return true;
                return BLOCK_INFO[this.grid[x][y]].solid;
            }

            getBlock(x, y) {
                if (!this.isValid(x, y)) return BLOCKS.BEDROCK;
                return this.grid[x][y];
            }

            setBlock(x, y, blockType) {
                if (this.isValid(x, y) && this.grid[x][y] !== BLOCKS.BEDROCK) {
                    this.grid[x][y] = blockType;
                    return true;
                }
                return false;
            }

            updateFluidPhysics() {
                const leftToRight = Math.random() < 0.5;
                for (let y = this.height - 3; y >= 0; y--) {
                    if (leftToRight) {
                        for (let x = 1; x < this.width - 1; x++) {
                            this.simulateBlock(x, y);
                        }
                    } else {
                        for (let x = this.width - 2; x >= 1; x--) {
                            this.simulateBlock(x, y);
                        }
                    }
                }
            }

            simulateBlock(x, y) {
                const block = this.grid[x][y];

                if (block === BLOCKS.SAND) {
                    const below = this.grid[x][y + 1];
                    if (below === BLOCKS.AIR || below === BLOCKS.WATER) {
                        this.swap(x, y, x, y + 1);
                    } else {
                        const leftBelow = this.grid[x - 1][y + 1];
                        const rightBelow = this.grid[x + 1][y + 1];
                        const leftFree = leftBelow === BLOCKS.AIR || leftBelow === BLOCKS.WATER;
                        const rightFree = rightBelow === BLOCKS.AIR || rightBelow === BLOCKS.WATER;

                        if (leftFree && rightFree) {
                            const dir = Math.random() < 0.5 ? -1 : 1;
                            this.swap(x, y, x + dir, y + 1);
                        } else if (leftFree) {
                            this.swap(x, y, x - 1, y + 1);
                        } else if (rightFree) {
                            this.swap(x, y, x + 1, y + 1);
                        }
                    }
                }

                else if (block === BLOCKS.WATER) {
                    const below = this.grid[x][y + 1];
                    if (below === BLOCKS.AIR) {
                        this.swap(x, y, x, y + 1);
                    } else {
                        const left = this.grid[x - 1][y];
                        const right = this.grid[x + 1][y];
                        const leftFree = left === BLOCKS.AIR;
                        const rightFree = right === BLOCKS.AIR;

                        if (leftFree && rightFree) {
                            const dir = Math.random() < 0.5 ? -1 : 1;
                            this.swap(x, y, x + dir, y);
                        } else if (leftFree) {
                            this.swap(x, y, x - 1, y);
                        } else if (rightFree) {
                            this.swap(x, y, x + 1, y);
                        }
                    }
                }
            }

            swap(x1, y1, x2, y2) {
                const temp = this.grid[x1][y1];
                this.grid[x1][y1] = this.grid[x2][y2];
                this.grid[x2][y2] = temp;
            }
        }

        // ==========================================
        // 6. PARTICLE EFFECT SYSTEM
        // ==========================================
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            spawn(x, y, color, count = 8) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 50 + Math.random() * 150;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 50,
                        color: color,
                        alpha: 1.0,
                        size: 3 + Math.random() * 4,
                        life: 0.3 + Math.random() * 0.3
                    });
                }
            }

            update(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.vy += GRAVITY * 0.5 * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.alpha -= dt / p.life;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            draw(ctx, camera) {
                ctx.save();
                this.particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillRect(p.x - camera.x, p.y - camera.y, p.size, p.size);
                });
                ctx.restore();
            }
        }

        // ==========================================
        // 7. PLAYER CONTROLLER & ENTITY
        // ==========================================
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 20;
                this.height = 48;
                this.vx = 0;
                this.vy = 0;
                this.ax = 0;
                this.onGround = false;
                this.inWater = false;
                this.selectedBlock = BLOCKS.DIRT;

                this.walkCycle = 0;
                this.armSwing = 0;
                this.miningAnim = 0;
                this.facing = 1;

                this.stepTimer = 0;
            }

            isPlayerInWater(world) {
                const startX = Math.floor(this.x / BLOCK_SIZE);
                const endX = Math.floor((this.x + this.width) / BLOCK_SIZE);
                const startY = Math.floor(this.y / BLOCK_SIZE);
                const endY = Math.floor((this.y + this.height) / BLOCK_SIZE);

                for (let y = startY; y <= endY; y++) {
                    for (let x = startX; x <= endX; x++) {
                        if (world.getBlock(x, y) === BLOCKS.WATER) {
                            return true;
                        }
                    }
                }
                return false;
            }

            update(dt, world) {
                const inWater = this.isPlayerInWater(world);
                this.inWater = inWater;

                // Physics modifiers inside fluids (buoyancy & water friction)
                if (inWater) {
                    this.vy += GRAVITY * 0.15 * dt;
                    if (this.vy > 100) this.vy = 100;
                    if (this.vy < -150) this.vy = -150;
                } else {
                    this.vy += GRAVITY * dt;
                    if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
                }

                // Slower acceleration in water
                this.vx += this.ax * WALK_ACCEL * (inWater ? 0.6 : 1.0) * dt;
                this.vx *= Math.pow(FRICTION, dt * 60);

                if (Math.abs(this.vx) > 10) {
                    this.facing = Math.sign(this.vx);
                }

                if (this.onGround && Math.abs(this.vx) > 15) {
                    this.walkCycle += Math.abs(this.vx) * dt * 0.05;
                    this.stepTimer += dt;
                    if (this.stepTimer > 0.35) {
                        audio.playStep();
                        this.stepTimer = 0;
                    }
                } else {
                    this.walkCycle = 0;
                    this.stepTimer = 0.3;
                }

                const stepSize = BLOCK_SIZE * 0.4;
                const distance = Math.hypot(this.vx * dt, this.vy * dt);
                const steps = Math.max(1, Math.ceil(distance / stepSize));

                const subDt = dt / steps;
                for (let s = 0; s < steps; s++) {
                    this.x += this.vx * subDt;
                    this.resolveCollisionsX(world);

                    this.y += this.vy * subDt;
                    this.resolveCollisionsY(world);
                }

                if (this.x < 0) {
                    this.x = 0;
                    this.vx = 0;
                } else if (this.x + this.width > world.width * BLOCK_SIZE) {
                    this.x = world.width * BLOCK_SIZE - this.width;
                    this.vx = 0;
                }
            }

            jump() {
                if (this.onGround) {
                    this.vy = JUMP_FORCE;
                    this.onGround = false;
                    audio.playJump();
                } else if (this.inWater) {
                    this.vy = JUMP_FORCE * 0.35; // Swim stroke up
                    audio.playStep();
                }
            }

            resolveCollisionsX(world) {
                const startX = Math.floor(this.x / BLOCK_SIZE);
                const endX = Math.floor((this.x + this.width) / BLOCK_SIZE);
                // Apply a small Y-inset to avoid colliding with the ground underneath our feet
                const startY = Math.floor((this.y + 4) / BLOCK_SIZE);
                const endY = Math.floor((this.y + this.height - 4) / BLOCK_SIZE);

                for (let y = startY; y <= endY; y++) {
                    for (let x = startX; x <= endX; x++) {
                        if (world.isSolid(x, y)) {
                            if (this.vx > 0) {
                                this.x = x * BLOCK_SIZE - this.width - 0.01;
                                this.vx = 0;
                            } else if (this.vx < 0) {
                                this.x = (x + 1) * BLOCK_SIZE + 0.01;
                                this.vx = 0;
                            }
                        }
                    }
                }
            }

            resolveCollisionsY(world) {
                // Apply a small X-inset to avoid catching on vertical wall seams when sliding
                const startX = Math.floor((this.x + 4) / BLOCK_SIZE);
                const endX = Math.floor((this.x + this.width - 4) / BLOCK_SIZE);
                const startY = Math.floor(this.y / BLOCK_SIZE);
                const endY = Math.floor((this.y + this.height) / BLOCK_SIZE);

                this.onGround = false;
                for (let y = startY; y <= endY; y++) {
                    for (let x = startX; x <= endX; x++) {
                        if (world.isSolid(x, y)) {
                            if (this.vy > 0) {
                                this.y = y * BLOCK_SIZE - this.height - 0.01;
                                this.vy = 0;
                                this.onGround = true;
                            } else if (this.vy < 0) {
                                this.y = (y + 1) * BLOCK_SIZE + 0.01;
                                this.vy = 0;
                            }
                        }
                    }
                }
            }

            draw(ctx, camera, gameTime) {
                ctx.save();
                ctx.translate(this.x - camera.x + this.width / 2, this.y - camera.y + this.height / 2);
                ctx.scale(this.facing, 1);

                ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
                ctx.beginPath();
                ctx.ellipse(0, this.height / 2 - 1, 10, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                const legSwing = Math.sin(this.walkCycle) * 12;
                ctx.strokeStyle = "#474f70";
                ctx.lineWidth = 6;
                ctx.lineCap = "round";

                ctx.beginPath();
                ctx.moveTo(-2, 10);
                ctx.lineTo(-2 - legSwing, this.height / 2 - 3);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(2, 10);
                ctx.lineTo(2 + legSwing, this.height / 2 - 3);
                ctx.stroke();

                ctx.fillStyle = "#ff6b6b";
                ctx.beginPath();
                ctx.roundRect(-8, -12, 16, 22, 5);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(0, -20, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#2c3e50";
                ctx.beginPath();
                ctx.roundRect(2, -23, 7, 7, 2);
                ctx.fill();
                ctx.fillStyle = "#4fc3f7";
                ctx.beginPath();
                ctx.roundRect(3, -22, 5, 5, 1);
                ctx.fill();

                ctx.fillStyle = "#ffd700";
                ctx.beginPath();
                ctx.roundRect(-12, -10, 5, 14, 2);
                ctx.fill();

                ctx.strokeStyle = "#474f70";
                ctx.lineWidth = 4;
                ctx.lineCap = "round";

                const isMining = this.miningAnim > 0;
                let armAngle = 0.5;
                if (isMining) {
                    armAngle = -0.5 + Math.sin(this.miningAnim * Math.PI * 4) * 0.8;
                }

                ctx.save();
                ctx.translate(2, -8);
                ctx.rotate(armAngle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(12, 6);
                ctx.stroke();

                ctx.strokeStyle = "#7f8c8d";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(12, 6);
                ctx.lineTo(12 + 6, 6 + 10);
                ctx.stroke();

                ctx.strokeStyle = "#bdc3c7";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(12 + 10, 6 + 4);
                ctx.arc(12 + 6, 6 + 10, 6, -1, 2);
                ctx.stroke();

                ctx.restore();
                ctx.restore();
            }
        }

        // ==========================================
        // 8. CAMERA SYSTEM & SMOOTH LERP
        // ==========================================
        class Camera {
            constructor(x, y, screenWidth, screenHeight) {
                this.x = x;
                this.y = y;
                this.width = screenWidth;
                this.height = screenHeight;
            }

            resize(width, height) {
                this.width = width;
                this.height = height;
            }

            follow(player, worldWidth, worldHeight, dt) {
                const targetX = player.x + player.width / 2 - this.width / 2;
                const targetY = player.y + player.height / 2 - this.height / 2;

                const lerpFactor = 1.0 - Math.pow(0.01, dt);
                this.x += (targetX - this.x) * lerpFactor;
                this.y += (targetY - this.y) * lerpFactor;

                const maxCamX = worldWidth * BLOCK_SIZE - this.width;
                const maxCamY = worldHeight * BLOCK_SIZE - this.height;

                this.x = Math.max(0, Math.min(this.x, maxCamX));
                this.y = Math.max(0, Math.min(this.y, maxCamY));
            }
        }

        // ==========================================
        // 9. CORE ENGINE & GAME MANAGER
        // ==========================================
        class Game {
            constructor() {
                this.canvas = document.getElementById("gameCanvas");
                this.ctx = this.canvas.getContext("2d");
                this.world = null;
                this.player = null;
                this.camera = null;
                this.particles = new ParticleSystem();
                this.parallaxNoise = new Noise2D(90);

                this.pointers = {};
                this.joystick = {
                    active: false,
                    pointerId: null,
                    startX: 0,
                    startY: 0,
                    curX: 0,
                    curY: 0,
                    radius: 50,
                    threshold: 8
                };

                this.miningTarget = null;
                this.keys = {};
                this.skyTime = 6000;

                this.fps = 0;
                this.updateTime = 0;
                this.renderTime = 0;

                this.inventory = [
                    BLOCKS.DIRT,
                    BLOCKS.STONE,
                    BLOCKS.SAND,
                    BLOCKS.WOOD,
                    BLOCKS.LEAVES,
                    BLOCKS.GLASS,
                    BLOCKS.WATER
                ];

                this.init();
            }

            init() {
                this.resizeCanvas();
                window.addEventListener("resize", () => this.resizeCanvas());

                generateTextures();
                this.world = new World(WORLD_WIDTH_CHUNKS, WORLD_HEIGHT_CHUNKS);
                
                const spawnX = Math.floor(this.world.width / 2);
                const spawnY = this.world.getSurfaceY(spawnX) - 2;
                this.player = new Player(spawnX * BLOCK_SIZE, spawnY * BLOCK_SIZE);
                this.player.selectedBlock = this.inventory[0];
                
                this.camera = new Camera(this.player.x, this.player.y, this.canvas.width, this.canvas.height);

                this.setupHotbarUI();
                this.setupEvents();

                setTimeout(() => {
                    const tut = document.getElementById("tutorial-overlay");
                    if (tut) tut.style.opacity = 0;
                }, 6000);
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                if (this.camera) {
                    this.camera.resize(this.canvas.width, this.canvas.height);
                }
            }

            setupHotbarUI() {
                const container = document.getElementById("hotbar");
                container.innerHTML = "";
                this.inventory.forEach((blockId, index) => {
                    const info = BLOCK_INFO[blockId];
                    const slot = document.createElement("div");
                    slot.className = `hotbar-slot ${index === 0 ? 'selected' : ''}`;
                    slot.dataset.index = index;

                    const preview = document.createElement("canvas");
                    preview.width = 32;
                    preview.height = 32;
                    const pCtx = preview.getContext("2d");
                    pCtx.drawImage(Textures[blockId], 0, 0);

                    slot.appendChild(preview);

                    const nameTag = document.createElement("span");
                    nameTag.className = "slot-name";
                    nameTag.innerText = info.name;
                    slot.appendChild(nameTag);

                    slot.addEventListener("pointerdown", (e) => {
                        e.stopPropagation();
                        document.querySelectorAll(".hotbar-slot").forEach(s => s.classList.remove("selected"));
                        slot.classList.add("selected");
                        this.player.selectedBlock = blockId;
                        audio.playPlace();
                    });

                    container.appendChild(slot);
                });
            }

            setupEvents() {
                this.canvas.addEventListener("pointerdown", (e) => this.onPointerDown(e));
                this.canvas.addEventListener("pointermove", (e) => this.onPointerMove(e));
                this.canvas.addEventListener("pointerup", (e) => this.onPointerUp(e));
                this.canvas.addEventListener("pointercancel", (e) => this.onPointerUp(e));

                window.addEventListener("keydown", (e) => {
                    this.keys[e.code] = true;
                    if (e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") {
                        this.player.jump();
                    }
                    if (e.key >= '1' && e.key <= '7') {
                        const idx = parseInt(e.key) - 1;
                        if (idx < this.inventory.length) {
                            document.querySelectorAll(".hotbar-slot").forEach(s => s.classList.remove("selected"));
                            const slot = document.querySelector(`.hotbar-slot[data-index="${idx}"]`);
                            if (slot) slot.classList.add("selected");
                            this.player.selectedBlock = this.inventory[idx];
                            audio.playPlace();
                        }
                    }
                });
                window.addEventListener("keyup", (e) => {
                    this.keys[e.code] = false;
                });

                document.getElementById("btn-sound").addEventListener("pointerdown", (e) => {
                    e.stopPropagation();
                    audio.muted = !audio.muted;
                    document.getElementById("btn-sound").innerText = audio.muted ? "🔇 Mute" : "🔊 Sonido";
                });

                document.getElementById("btn-reset").addEventListener("pointerdown", (e) => {
                    e.stopPropagation();
                    this.teleportPlayerToSurface();
                });
            }

            teleportPlayerToSurface() {
                const px = Math.max(0, Math.min(Math.floor(this.player.x / BLOCK_SIZE), this.world.width - 1));
                const py = this.world.getSurfaceY(px) - 2;
                this.player.x = px * BLOCK_SIZE;
                this.player.y = py * BLOCK_SIZE;
                this.player.vx = 0;
                this.player.vy = 0;
                this.miningTarget = null;
                audio.playPlace();
            }

            onPointerDown(e) {
                e.preventDefault();
                // Capture touch target focus to mitigate touch drift near screens boundary edges
                e.target.setPointerCapture(e.pointerId);
                this.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

                if (e.clientX < window.innerWidth / 2) {
                    if (!this.joystick.active) {
                        this.joystick.active = true;
                        this.joystick.pointerId = e.pointerId;
                        this.joystick.startX = e.clientX;
                        this.joystick.startY = e.clientY;
                        this.joystick.curX = e.clientX;
                        this.joystick.curY = e.clientY;
                    }
                } 
                else {
                    this.handleActionPointer(e.pointerId, e.clientX, e.clientY, true);
                }
            }

            onPointerMove(e) {
                e.preventDefault();
                if (!this.pointers[e.pointerId]) return;
                this.pointers[e.pointerId].x = e.clientX;
                this.pointers[e.pointerId].y = e.clientY;

                if (this.joystick.active && this.joystick.pointerId === e.pointerId) {
                    this.joystick.curX = e.clientX;
                    this.joystick.curY = e.clientY;

                    const dx = this.joystick.curX - this.joystick.startX;
                    const dy = this.joystick.curY - this.joystick.startY;
                    const dist = Math.hypot(dx, dy);

                    if (dist > this.joystick.threshold) {
                        this.player.ax = Math.max(-1, Math.min(dx / this.joystick.radius, 1));
                        if (dy < -this.joystick.radius * 0.75) {
                            this.player.jump();
                        }
                    } else {
                        this.player.ax = 0;
                    }
                } 
                else {
                    this.handleActionPointer(e.pointerId, e.clientX, e.clientY, false);
                }
            }

            onPointerUp(e) {
                e.preventDefault();
                try {
                    e.target.releasePointerCapture(e.pointerId);
                } catch (err) {}
                delete this.pointers[e.pointerId];

                if (this.joystick.active && this.joystick.pointerId === e.pointerId) {
                    this.joystick.active = false;
                    this.joystick.pointerId = null;
                    this.player.ax = 0;
                }

                if (this.miningTarget && this.miningTarget.pointerId === e.pointerId) {
                    this.miningTarget = null;
                }
            }

            handleActionPointer(pointerId, screenX, screenY, isNewClick) {
                const worldX = screenX + this.camera.x;
                const worldY = screenY + this.camera.y;

                const gridX = Math.floor(worldX / BLOCK_SIZE);
                const gridY = Math.floor(worldY / BLOCK_SIZE);

                const pCenterX = this.player.x + this.player.width / 2;
                const pCenterY = this.player.y + this.player.height / 2;
                const bCenterX = (gridX + 0.5) * BLOCK_SIZE;
                const bCenterY = (gridY + 0.5) * BLOCK_SIZE;
                const dist = Math.hypot(bCenterX - pCenterX, bCenterY - pCenterY);

                if (dist > INTERACTION_RANGE) {
                    this.miningTarget = null;
                    return;
                }

                const blockType = this.world.getBlock(gridX, gridY);

                if (blockType !== BLOCKS.AIR && BLOCK_INFO[blockType].hardness !== Infinity) {
                    if (isNewClick || !this.miningTarget || this.miningTarget.gridX !== gridX || this.miningTarget.gridY !== gridY) {
                        this.miningTarget = {
                            pointerId: pointerId,
                            gridX: gridX,
                            gridY: gridY,
                            progress: 0,
                            maxHardness: BLOCK_INFO[blockType].hardness
                        };
                    }
                } 
                else if (blockType === BLOCKS.AIR && isNewClick) {
                    const adjacents = [
                        this.world.getBlock(gridX + 1, gridY),
                        this.world.getBlock(gridX - 1, gridY),
                        this.world.getBlock(gridX, gridY + 1),
                        this.world.getBlock(gridX, gridY - 1)
                    ];
                    const hasSolidNeighbour = adjacents.some(b => b !== BLOCKS.AIR && BLOCK_INFO[b].solid);

                    // Optimized AABB collision check without heap object allocations
                    const blockLeft = gridX * BLOCK_SIZE;
                    const blockRight = blockLeft + BLOCK_SIZE;
                    const blockTop = gridY * BLOCK_SIZE;
                    const blockBottom = blockTop + BLOCK_SIZE;
                    const playerLeft = this.player.x;
                    const playerRight = playerLeft + this.player.width;
                    const playerTop = this.player.y;
                    const playerBottom = playerTop + this.player.height;
                    const overlap = (
                        playerLeft < blockRight &&
                        playerRight > blockLeft &&
                        playerTop < blockBottom &&
                        playerBottom > playerTop
                    );

                    const placeInfo = BLOCK_INFO[this.player.selectedBlock];
                    const placementAllowed = hasSolidNeighbour && (!placeInfo.solid || !overlap);

                    if (placementAllowed) {
                        const blockToPlace = this.player.selectedBlock;
                        if (this.world.setBlock(gridX, gridY, blockToPlace)) {
                            audio.playPlace();
                            this.particles.spawn(
                                (gridX + 0.5) * BLOCK_SIZE,
                                (gridY + 0.5) * BLOCK_SIZE,
                                placeInfo.color,
                                5
                            );
                        }
                    }
                }
            }

            update(dt) {
                if (this.keys["KeyA"] || this.keys["ArrowLeft"]) {
                    this.player.ax = -1;
                } else if (this.keys["KeyD"] || this.keys["ArrowRight"]) {
                    this.player.ax = 1;
                } else if (!this.joystick.active) {
                    this.player.ax = 0;
                }

                this.player.update(dt, this.world);

                if (Math.random() < 0.25) {
                    this.world.updateFluidPhysics();
                }

                if (this.miningTarget) {
                    this.player.miningAnim += dt;
                    this.miningTarget.progress += dt;
                    if (Math.random() < 0.25) {
                        audio.playMine();
                        const pColor = BLOCK_INFO[this.world.getBlock(this.miningTarget.gridX, this.miningTarget.gridY)].color;
                        this.particles.spawn(
                            (this.miningTarget.gridX + 0.5) * BLOCK_SIZE,
                            (this.miningTarget.gridY + 0.5) * BLOCK_SIZE,
                            pColor,
                            1
                        );
                    }

                    if (this.miningTarget.progress >= this.miningTarget.maxHardness) {
                        const targetBlock = this.world.getBlock(this.miningTarget.gridX, this.miningTarget.gridY);
                        const blockColor = BLOCK_INFO[targetBlock].color;
                        
                        this.world.setBlock(this.miningTarget.gridX, this.miningTarget.gridY, BLOCKS.AIR);
                        audio.playBreak();

                        this.particles.spawn(
                            (this.miningTarget.gridX + 0.5) * BLOCK_SIZE,
                            (this.miningTarget.gridY + 0.5) * BLOCK_SIZE,
                            blockColor,
                            12
                        );
                        
                        this.miningTarget = null;
                        this.player.miningAnim = 0;
                    }
                } else {
                    this.player.miningAnim = 0;
                }

                this.camera.follow(this.player, this.world.width, this.world.height, dt);
                this.particles.update(dt);
                this.skyTime = (this.skyTime + dt * 25) % 24000;

                if (this.player.y > (this.world.height + 5) * BLOCK_SIZE) {
                    this.teleportPlayerToSurface();
                }
            }

            render() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                this.drawSky(ctx, width, height);

                const startCol = Math.max(0, Math.floor(this.camera.x / BLOCK_SIZE));
                const endCol = Math.min(this.world.width - 1, Math.ceil((this.camera.x + width) / BLOCK_SIZE));
                const startRow = Math.max(0, Math.floor(this.camera.y / BLOCK_SIZE));
                const endRow = Math.min(this.world.height - 1, Math.ceil((this.camera.y + height) / BLOCK_SIZE));

                let blocksRenderedCount = 0;

                for (let x = startCol; x <= endCol; x++) {
                    for (let y = startRow; y <= endRow; y++) {
                        const block = this.world.getBlock(x, y);
                        if (block !== BLOCKS.AIR) {
                            ctx.drawImage(
                                Textures[block], 
                                x * BLOCK_SIZE - this.camera.x, 
                                y * BLOCK_SIZE - this.camera.y
                            );
                            blocksRenderedCount++;
                        }
                    }
                }

                if (this.miningTarget) {
                    const blockX = this.miningTarget.gridX * BLOCK_SIZE - this.camera.x;
                    const blockY = this.miningTarget.gridY * BLOCK_SIZE - this.camera.y;

                    ctx.save();
                    ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 + Math.sin(performance.now() * 0.01) * 0.25})`;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(blockX + 1.5, blockY + 1.5, BLOCK_SIZE - 3, BLOCK_SIZE - 3);

                    const pct = this.miningTarget.progress / this.miningTarget.maxHardness;
                    if (pct > 0.1) {
                        ctx.strokeStyle = "rgba(0,0,0,0.85)";
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        const segments = Math.floor(pct * 5) + 2;
                        let cx = blockX + BLOCK_SIZE / 2;
                        let cy = blockY + BLOCK_SIZE / 2;
                        ctx.moveTo(cx, cy);
                        const rand = mulberry32(this.miningTarget.gridX * 12 + this.miningTarget.gridY * 9);
                        for (let s = 0; s < segments; s++) {
                            cx += (rand() - 0.5) * (BLOCK_SIZE * 0.5);
                            cy += (rand() - 0.5) * (BLOCK_SIZE * 0.5);
                            ctx.lineTo(
                                Math.max(blockX + 2, Math.min(cx, blockX + BLOCK_SIZE - 2)),
                                Math.max(blockY + 2, Math.min(cy, blockY + BLOCK_SIZE - 2))
                            );
                        }
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                this.player.draw(ctx, this.camera, this.skyTime);
                this.particles.draw(ctx, this.camera);

                if (this.joystick.active) {
                    this.drawJoystick(ctx);
                }

                document.getElementById("val-fps").innerText = Math.round(this.fps);
                document.getElementById("val-up").innerText = `${this.updateTime.toFixed(1)}ms`;
                document.getElementById("val-ren").innerText = `${this.renderTime.toFixed(1)}ms`;
                document.getElementById("val-x").innerText = Math.round(this.player.x);
                document.getElementById("val-y").innerText = Math.round(this.player.y);
                document.getElementById("val-chunks").innerText = `${startCol}-${endCol}`;
                document.getElementById("val-blocks").innerText = blocksRenderedCount;
            }

            blendColors(c1, c2, ratio) {
                const r = Math.round(c1.r + (c2.r - c1.r) * ratio);
                const g = Math.round(c1.g + (c2.g - c1.g) * ratio);
                const b = Math.round(c1.b + (c2.b - c1.b) * ratio);
                return `rgb(${r}, ${g}, ${b})`;
            }

            drawSky(ctx, width, height) {
                let gradient = ctx.createLinearGradient(0, 0, 0, height);
                let skyAngle = (this.skyTime / 24000) * Math.PI * 2;

                let skyTop, skyBot;

                if (this.skyTime >= 0 && this.skyTime < 4000) {
                    const ratio = this.skyTime / 4000;
                    skyTop = this.blendColors(SKY_COLORS.NIGHT_TOP, SKY_COLORS.DAY_TOP, ratio);
                    skyBot = this.blendColors(SKY_COLORS.NIGHT_BOT, SKY_COLORS.SUNRISE_BOT, ratio);
                } else if (this.skyTime >= 4000 && this.skyTime < 12000) {
                    skyTop = `rgb(${SKY_COLORS.DAY_TOP.r}, ${SKY_COLORS.DAY_TOP.g}, ${SKY_COLORS.DAY_TOP.b})`;
                    skyBot = `rgb(${SKY_COLORS.DAY_BOT.r}, ${SKY_COLORS.DAY_BOT.g}, ${SKY_COLORS.DAY_BOT.b})`;
                } else if (this.skyTime >= 12000 && this.skyTime < 16000) {
                    const ratio = (this.skyTime - 12000) / 4000;
                    skyTop = this.blendColors(SKY_COLORS.DAY_TOP, SKY_COLORS.SUNSET_TOP, ratio);
                    skyBot = this.blendColors(SKY_COLORS.DAY_BOT, SKY_COLORS.SUNSET_BOT, ratio);
                } else {
                    const ratio = (this.skyTime - 16000) / 8000;
                    skyTop = this.blendColors(SKY_COLORS.SUNSET_TOP, SKY_COLORS.NIGHT_TOP, ratio);
                    skyBot = this.blendColors(SKY_COLORS.SUNSET_BOT, SKY_COLORS.NIGHT_BOT, ratio);
                }

                gradient.addColorStop(0, skyTop);
                gradient.addColorStop(1, skyBot);
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                if (this.skyTime > 14000 || this.skyTime < 5000) {
                    ctx.save();
                    let starAlpha = 0;
                    if (this.skyTime > 16000 && this.skyTime < 22000) starAlpha = 1;
                    else if (this.skyTime >= 14000 && this.skyTime <= 16000) starAlpha = (this.skyTime - 14000) / 2000;
                    else if (this.skyTime >= 22000) starAlpha = 1.0 - (this.skyTime - 22000) / 2000;
                    else if (this.skyTime < 5000) starAlpha = 1.0 - this.skyTime / 5000;

                    ctx.globalAlpha = starAlpha * 0.75;
                    ctx.fillStyle = "#ffffff";
                    
                    const rand = mulberry32(2026);
                    for (let i = 0; i < 40; i++) {
                        const sx = rand() * width;
                        const sy = rand() * (height * 0.65);
                        const r = 1 + rand() * 1.5;
                        ctx.beginPath();
                        ctx.arc(sx, sy, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                ctx.save();
                const centerX = width / 2;
                const centerY = height * 0.75;
                const radius = Math.min(width, height) * 0.6;
                const cx = centerX + Math.cos(skyAngle - Math.PI/2) * radius;
                const cy = centerY + Math.sin(skyAngle - Math.PI/2) * radius;

                if (this.skyTime >= 2000 && this.skyTime < 14000) {
                    ctx.fillStyle = "#f39c12";
                    ctx.shadowColor = "#f1c40f";
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 28, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = "#f1f2f6";
                    ctx.shadowColor = "#ffffff";
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 22, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                this.drawParallaxHills(ctx, width, height);
            }

            drawParallaxHills(ctx, width, height) {
                ctx.fillStyle = "rgba(42, 45, 68, 0.4)";
                ctx.beginPath();
                ctx.moveTo(0, height);
                for (let x = 0; x <= width; x += 16) {
                    const my = height * 0.75 + this.parallaxNoise.noise((x + this.camera.x * 0.1) * 0.003, 0) * 120;
                    ctx.lineTo(x, my);
                }
                ctx.lineTo(width, height);
                ctx.fill();

                ctx.fillStyle = "rgba(65, 82, 100, 0.3)";
                ctx.beginPath();
                ctx.moveTo(0, height);
                for (let x = 0; x <= width; x += 16) {
                    const my = height * 0.8 + this.parallaxNoise.noise((x + this.camera.x * 0.25) * 0.005, 50) * 70;
                    ctx.lineTo(x, my);
                }
                ctx.lineTo(width, height);
                ctx.fill();
            }

            drawJoystick(ctx) {
                ctx.save();
                ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(this.joystick.startX, this.joystick.startY, this.joystick.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                const dx = this.joystick.curX - this.joystick.startX;
                const dy = this.joystick.curY - this.joystick.startY;
                const angle = Math.atan2(dy, dx);
                const dist = Math.min(Math.hypot(dx, dy), this.joystick.radius);

                const knobX = this.joystick.startX + Math.cos(angle) * dist;
                const knobY = this.joystick.startY + Math.sin(angle) * dist;

                ctx.fillStyle = "rgba(255, 215, 0, 0.75)";
                ctx.beginPath();
                ctx.arc(knobX, knobY, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        window.addEventListener("load", () => {
            const game = new Game();

            const fixedDt = 1 / 60;
            let accumulator = 0;
            let lastTime = performance.now();

            let frameCount = 0;
            let lastFpsTime = lastTime;

            function gameLoop(time) {
                let deltaTime = (time - lastTime) / 1000;
                if (deltaTime > 0.25) deltaTime = 0.25;
                lastTime = time;

                frameCount++;
                if (time - lastFpsTime >= 1000) {
                    game.fps = (frameCount * 1000) / (time - lastFpsTime);
                    frameCount = 0;
                    lastFpsTime = time;
                }

                const startUpdate = performance.now();
                accumulator += deltaTime;
                while (accumulator >= fixedDt) {
                    game.update(fixedDt);
                    accumulator -= fixedDt;
                }
                game.updateTime = performance.now() - startUpdate;

                const startRender = performance.now();
                game.render();
                game.renderTime = performance.now() - startRender;

                requestAnimationFrame(gameLoop);
            }

            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
