<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Project Forge 2D - Sandbox de autómatas celulares estilo Noita con multijugador. Arena, agua, fuego, lava, ácido y más.">
    <title>Project Forge 2D — Noita Sandbox</title>
    <style>
        :root {
            --glass-bg: rgba(12, 12, 22, 0.72);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ffd700;
            --accent-glow: rgba(255, 215, 0, 0.35);
            --danger: #ff4757;
            --safe: #2ed573;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #080810; font-family: var(--font); color: #fff; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1; image-rendering: pixelated; image-rendering: -moz-crisp-edges; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
        .interact { pointer-events: auto; }
        .panel { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px; gap: 8px; }
        #perf { font-family: monospace; font-size: 10px; line-height: 1.45; color: #8a8fb0; }
        #perf span { color: var(--accent); }
        #hp-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        #hp-fill { height: 100%; background: linear-gradient(90deg, var(--danger), var(--safe)); border-radius: 3px; transition: width 0.3s; }
        .btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; padding: 9px 14px; min-height: 44px; min-width: 44px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 10px; transition: background 0.15s, transform 0.1s; }
        .btn:active { transform: scale(0.93); background: rgba(255,255,255,0.12); }
        .btn.active { border-color: var(--accent); background: var(--accent-glow); }
        #controls-top { display: flex; gap: 6px; flex-wrap: wrap; }
        #bottom-bar { display: flex; flex-direction: column; align-items: center; padding: 0 10px 14px; gap: 10px; }
        #tools-row { display: flex; gap: 8px; align-items: center; }
        #tools { display: flex; gap: 6px; }
        #brush-row { display: flex; align-items: center; gap: 8px; background: rgba(8,8,16,0.82); border: 1px solid var(--glass-border); padding: 5px 12px; border-radius: 12px; }
        #brush-row label { font-size: 10px; color: #8a8fb0; white-space: nowrap; }
        #brush-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; }
        #brush-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 6px var(--accent-glow); }
        #brush-val { font-size: 11px; color: var(--accent); font-family: monospace; min-width: 16px; text-align: center; }
        #palette { display: flex; gap: 5px; background: rgba(8,8,16,0.82); border: 2px solid var(--glass-border); padding: 5px 8px; border-radius: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 8px 28px rgba(0,0,0,0.5); max-width: calc(100vw - 20px); }
        .mat-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; position: relative; flex-shrink: 0; transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s; }
        .mat-btn:active { transform: scale(0.88); }
        .mat-btn.sel { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .mat-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 8px; color: #888; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .mat-btn.sel .mat-label { opacity: 1; }
        /* Multiplayer Panel */
        #mp-toggle { position: relative; }
        #mp-panel { position: absolute; bottom: 100%; right: 0; margin-bottom: 8px; width: 280px; display: none; flex-direction: column; gap: 8px; padding: 14px; }
        #mp-panel.show { display: flex; }
        #mp-panel h3 { margin: 0; font-size: 14px; color: var(--accent); }
        #mp-panel textarea { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: #ccc; font-family: monospace; font-size: 10px; padding: 6px; border-radius: 6px; resize: none; }
        #mp-status { font-size: 11px; color: #8a8fb0; }
        .mp-row { display: flex; gap: 6px; }
        .mp-row .btn { flex: 1; font-size: 11px; padding: 7px 8px; min-height: 36px; }
        /* Tutorial */
        #tutorial { position: absolute; top: 18%; left: 50%; transform: translate(-50%,-18%); text-align: center; pointer-events: none; opacity: 1; transition: opacity 2s ease-out; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
        #tutorial h1 { font-size: 26px; letter-spacing: 1px; background: linear-gradient(45deg, #ffd700, #ff6b35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        #tutorial p { font-size: 13px; color: #bbb; }
        /* Respawn flash overlay */
        #respawn-flash { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; opacity:0; background: radial-gradient(circle, rgba(255,100,100,0.4) 0%, transparent 70%); transition: opacity 0.05s; }
        #mission-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 180px; text-align: center; }
        #score-display { font-size: 13px; font-weight: bold; color: var(--accent); text-shadow: 0 0 6px var(--accent-glow); }
        #mission-display { font-size: 10px; color: #a0a5c0; margin-top: 3px; font-weight: 500; }
        @media (max-width: 768px) {
            .mat-btn { width: 36px; height: 36px; }
            #tutorial h1 { font-size: 20px; }
            #tutorial p { font-size: 11px; }
            #brush-slider { width: 60px; }
            #mission-panel { min-width: 120px; padding: 4px 8px; }
            #score-display { font-size: 11px; }
            #mission-display { font-size: 9px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="respawn-flash"></div>
    <div id="hud">
        <div id="top-bar" class="interact">
            <div class="panel" id="perf-panel">
                <div id="perf">
                    FPS: <span id="v-fps">0</span> | Sim: <span id="v-sim">0</span>ms | Draw: <span id="v-draw">0</span>ms<br>
                    Pos: <span id="v-pos">0,0</span> | Celdas: <span id="v-cells">0</span><br>
                    Modo: <span id="v-mode">Solo</span>
                </div>
                <div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
            </div>
            <div class="panel" id="mission-panel">
                <div id="score-display">Score: <span id="v-score">0</span></div>
                <div id="mission-display">Misión: Cargando...</div>
            </div>
            <div id="controls-top">
                <button class="btn" id="btn-sound">🔊</button>
                <button class="btn" id="btn-music">🎵</button>
                <button class="btn" id="btn-reset">🌀</button>
                <div id="mp-toggle" class="interact">
                    <button class="btn" id="btn-mp">🎮</button>
                    <div id="mp-panel" class="panel">
                        <h3>🎮 Multijugador</h3>
                        <div class="mp-row">
                            <button class="btn" id="mp-local">👥 Local</button>
                            <button class="btn" id="mp-host">📡 Crear</button>
                            <button class="btn" id="mp-join">🔗 Unirse</button>
                        </div>
                        <textarea id="mp-code" rows="3" placeholder="Codigo de sala..." style="display:none"></textarea>
                        <div class="mp-row" id="mp-actions" style="display:none">
                            <button class="btn" id="mp-copy">📋 Copiar</button>
                            <button class="btn" id="mp-apply">📥 Aplicar</button>
                        </div>
                        <div id="mp-status">Desconectado</div>
                    </div>
                </div>
            </div>
        </div>
        <div id="tutorial">
            <h1>Project Forge 2D</h1>
            <p>🕹 Joystick para moverte • 🖌 Toca para crear • ⛏ Mina • 💣 Explota • 1-9 para materiales</p>
        </div>
        <div id="bottom-bar" class="interact">
            <div id="tools-row">
                <div id="tools"></div>
                <div id="brush-row">
                    <label>Brush</label>
                    <input type="range" id="brush-slider" min="1" max="8" value="3" step="1">
                    <span id="brush-val">3</span>
                </div>
            </div>
            <div id="palette"></div>
        </div>
    </div>

    <script>
    // =====================================================
    // 1. CONSTANTS & CONFIGURATION
    // =====================================================
    const WORLD_W = 512;
    const WORLD_H = 320;
    const GRAVITY = 0.4;
    const PLAYER_SPEED = 1.8;
    const PLAYER_JUMP = -4.5;
    const PLAYER_W = 6;
    const PLAYER_H = 12;
    const MAX_HP = 100;
    const INTERACTION_RANGE = 40;

    // =====================================================
    // 2. MATERIAL SYSTEM
    // =====================================================
    const MAT = {
        EMPTY:0, SAND:1, WATER:2, STONE:3, WOOD:4, FIRE:5, LAVA:6,
        STEAM:7, OIL:8, ACID:9, GUNPOWDER:10, SMOKE:11, DIRT:12,
        GRASS:13, GLASS:14, ICE:15, EMBER:16, BEDROCK:17
    };
    const PROPS = [];
    // type: 0=empty, 1=solid, 2=powder, 3=liquid, 4=gas
    PROPS[MAT.EMPTY]     = { n:'Vacio',    t:0, d:0,   fl:0, ar:1 };
    PROPS[MAT.SAND]      = { n:'Arena',    t:2, d:5,   fl:0, ar:0 };
    PROPS[MAT.WATER]     = { n:'Agua',     t:3, d:3,   fl:0, ar:1 };
    PROPS[MAT.STONE]     = { n:'Piedra',   t:1, d:10,  fl:0, ar:0 };
    PROPS[MAT.WOOD]      = { n:'Madera',   t:1, d:8,   fl:1, ar:0 };
    PROPS[MAT.FIRE]      = { n:'Fuego',    t:4, d:-2,  fl:0, ar:1 };
    PROPS[MAT.LAVA]      = { n:'Lava',     t:3, d:7,   fl:0, ar:1 };
    PROPS[MAT.STEAM]     = { n:'Vapor',    t:4, d:-1,  fl:0, ar:1 };
    PROPS[MAT.OIL]       = { n:'Petroleo', t:3, d:2,   fl:1, ar:0 };
    PROPS[MAT.ACID]      = { n:'Acido',    t:3, d:3.5, fl:0, ar:1 };
    PROPS[MAT.GUNPOWDER] = { n:'Polvora',  t:2, d:4,   fl:1, ar:0 };
    PROPS[MAT.SMOKE]     = { n:'Humo',     t:4, d:-1,  fl:0, ar:1 };
    PROPS[MAT.DIRT]      = { n:'Tierra',   t:1, d:7,   fl:0, ar:0 };
    PROPS[MAT.GRASS]     = { n:'Hierba',   t:1, d:7,   fl:1, ar:0 };
    PROPS[MAT.GLASS]     = { n:'Cristal',  t:1, d:9,   fl:0, ar:1 };
    PROPS[MAT.ICE]       = { n:'Hielo',    t:1, d:3,   fl:0, ar:1 };
    PROPS[MAT.EMBER]     = { n:'Brasa',    t:2, d:2,   fl:0, ar:1 };
    PROPS[MAT.BEDROCK]   = { n:'Roca',     t:1, d:99,  fl:0, ar:1 };

    // Palette materials player can place
    const PALETTE = [MAT.SAND, MAT.WATER, MAT.STONE, MAT.WOOD, MAT.FIRE, MAT.OIL, MAT.GUNPOWDER, MAT.LAVA, MAT.ACID, MAT.DIRT, MAT.GLASS, MAT.ICE, MAT.EMBER];
    const TOOL_PLACE = 0, TOOL_MINE = 1, TOOL_BOMB = 2;
    const TOOL_ICONS = ['🖌️','⛏️','💣'];

    // Color generators (packed ABGR for little-endian Uint32Array → RGBA in ImageData)
    function packC(r,g,b,a){return((a<<24)|(b<<16)|(g<<8)|r)>>>0;}
    function matColor(m) {
        const v = (rng()*40-20)|0;
        switch(m) {
            case MAT.SAND:      return packC(194+v, 178+v, 128+v, 255);
            case MAT.WATER:     return packC(40+(v>>1), 110+v, 220+(v>>1), 195);
            case MAT.STONE:     return packC(120+v, 120+v, 125+v, 255);
            case MAT.WOOD:      return packC(90+v, 65+(v>>1), 35, 255);
            case MAT.FIRE:      return packC(255, 120+(rng()*80|0), 20, 230);
            case MAT.LAVA:      return packC(220+(v>>1), 80+v, 15, 240);
            case MAT.STEAM:     return packC(200+v, 210+v, 225+v, 90);
            case MAT.OIL:       return packC(30+v, 25+v, 18, 230);
            case MAT.ACID:      return packC(50+v, 210+v, 50, 210);
            case MAT.GUNPOWDER: return packC(55+v, 50+v, 50+v, 255);
            case MAT.SMOKE:     return packC(80+v, 80+v, 85+v, 80);
            case MAT.DIRT:      return packC(100+v, 70+v, 45, 255);
            case MAT.GRASS:     return packC(60+v, 140+v, 50, 255);
            case MAT.GLASS:     return packC(200+(v>>1), 220+(v>>1), 240, 70);
            case MAT.ICE:       return packC(180+v, 210+v, 240, 200);
            case MAT.EMBER:     return packC(200+v, 100+(rng()*40|0), 20, 200);
            case MAT.BEDROCK:   return packC(30+v, 30+v, 35+v, 255);
            default:            return 0;
        }
    }
    // CSS color for palette buttons
    function matCSS(m) {
        switch(m) {
            case MAT.SAND: return '#c2b280'; case MAT.WATER: return '#2870dc';
            case MAT.STONE: return '#787878'; case MAT.WOOD: return '#5a4123';
            case MAT.OIL: return '#1e1912'; case MAT.GUNPOWDER: return '#373232';
            case MAT.LAVA: return '#dc5010'; case MAT.ACID: return '#32d232';
            case MAT.DIRT: return '#644628'; case MAT.GLASS: return '#c8dcf0';
            case MAT.ICE: return '#b4d2f0'; case MAT.FIRE: return '#ff6a00';
            case MAT.EMBER: return '#c85a00'; default: return '#444';
        }
    }

    // =====================================================
    // 3. DETERMINISTIC PRNG (LCG)
    // =====================================================
    let rngState = 20260617;
    function rng() { rngState = (rngState * 1664525 + 1013904223) & 0x7FFFFFFF; return rngState / 2147483647; }
    function rngSeed(s) { rngState = s; }

    // =====================================================
    // 4. PERLIN-LIKE NOISE (for world gen)
    // =====================================================
    class Noise2D {
        constructor(seed) {
            this.p = new Uint8Array(512);
            const r = () => { seed = (seed * 16807 + 0) % 2147483647; return seed / 2147483647; };
            for (let i = 0; i < 256; i++) this.p[i] = i;
            for (let i = 255; i > 0; i--) { const j = (r() * (i+1))|0; [this.p[i], this.p[j]] = [this.p[j], this.p[i]]; }
            for (let i = 0; i < 256; i++) this.p[256+i] = this.p[i];
        }
        fade(t){return t*t*t*(t*(t*6-15)+10);}
        lerp(t,a,b){return a+t*(b-a);}
        grad(h,x,y){const v=h&7;const u=v<4?x:y;const w=v<4?y:x;return((v&1)?-u:u)+((v&2)?-w:w);}
        noise(x,y){
            const X=Math.floor(x)&255,Y=Math.floor(y)&255;
            x-=Math.floor(x);y-=Math.floor(y);
            const u=this.fade(x),v=this.fade(y);
            const A=this.p[X]+Y,B=this.p[X+1]+Y;
            return this.lerp(v,this.lerp(u,this.grad(this.p[A],x,y),this.grad(this.p[B],x-1,y)),this.lerp(u,this.grad(this.p[A+1],x,y-1),this.grad(this.p[B+1],x-1,y-1)));
        }
    }

    // =====================================================
    // 5. CELLULAR AUTOMATA ENGINE
    // =====================================================
    const totalCells = WORLD_W * WORLD_H;
    const grid  = new Uint8Array(totalCells);
    const color = new Uint32Array(totalCells);
    const clock = new Uint8Array(totalCells);
    const life  = new Uint16Array(totalCells);
    let frameClock = 0;

    function idx(x, y) {
        if (y < 0 || y >= WORLD_H) return -1;
        x = ((x % WORLD_W) + WORLD_W) % WORLD_W; // horizontal wrap
        return y * WORLD_W + x;
    }
    function setCell(i, mat) {
        if (i < 0 || i >= totalCells) return;
        grid[i] = mat;
        color[i] = mat === MAT.EMPTY ? 0 : matColor(mat);
        clock[i] = frameClock;
        if (mat === MAT.FIRE) life[i] = 60 + (rng()*80|0);
        else if (mat === MAT.STEAM) life[i] = 120 + (rng()*100|0);
        else if (mat === MAT.SMOKE) life[i] = 80 + (rng()*60|0);
        else if (mat === MAT.EMBER) life[i] = 30 + (rng()*40|0);
        else life[i] = 0;
    }
    function swap(a, b) {
        const tm = grid[a], tc = color[a], tl = life[a];
        grid[a] = grid[b]; color[a] = color[b]; life[a] = life[b]; clock[a] = frameClock;
        grid[b] = tm; color[b] = tc; life[b] = tl; clock[b] = frameClock;
    }
    function canDisplace(mover, target) {
        if (target === MAT.EMPTY) return true;
        const mp = PROPS[mover], tp = PROPS[target];
        if (!tp || tp.t === 1) return false; // can't displace solids
        if (mp.t === 2 && tp.t >= 3) return true; // powder sinks in liquid/gas
        if (mp.t === 3 && tp.t === 4) return true; // liquid sinks through gas
        if (mp.d > tp.d && tp.t !== 1) return true;
        return false;
    }

    function simulate() {
        frameClock = 1 - frameClock;
        for (let y = WORLD_H - 2; y >= 1; y--) {
            const lr = (y + frameClock) & 1;
            const sx = lr ? 1 : WORLD_W - 2, ex = lr ? WORLD_W - 1 : 0, st = lr ? 1 : -1;
            for (let x = sx; x !== ex; x += st) {
                const i = y * WORLD_W + x;
                if (clock[i] === frameClock) continue;
                const m = grid[i];
                if (m === MAT.EMPTY || m === MAT.BEDROCK) continue;
                const p = PROPS[m];
                if (p.t === 2) simPowder(x, y, i, m);
                else if (p.t === 3) simLiquid(x, y, i, m);
                else if (p.t === 4) simGas(x, y, i, m);
                simInteract(x, y, i, m);
            }
        }
    }

    function simPowder(x, y, i, m) {
        const b = idx(x, y+1);
        if (b >= 0 && canDisplace(m, grid[b])) { swap(i, b); return; }
        const d = rng() < 0.5 ? 1 : -1;
        const d1 = idx(x+d, y+1), d2 = idx(x-d, y+1);
        if (d1 >= 0 && canDisplace(m, grid[d1])) swap(i, d1);
        else if (d2 >= 0 && canDisplace(m, grid[d2])) swap(i, d2);
    }
    function simLiquid(x, y, i, m) {
        const b = idx(x, y+1);
        if (b >= 0 && canDisplace(m, grid[b])) { swap(i, b); return; }
        const d = rng() < 0.5 ? 1 : -1;
        const d1 = idx(x+d, y+1), d2 = idx(x-d, y+1);
        if (d1 >= 0 && canDisplace(m, grid[d1])) { swap(i, d1); return; }
        if (d2 >= 0 && canDisplace(m, grid[d2])) { swap(i, d2); return; }
        // Spread horizontally (with dispersion)
        const spread = m === MAT.WATER ? 3 : (m === MAT.LAVA ? 1 : 2);
        for (let s = 1; s <= spread; s++) {
            const s1 = idx(x + d*s, y), s2 = idx(x - d*s, y);
            if (s1 >= 0 && canDisplace(m, grid[s1])) { swap(i, s1); return; }
            if (s2 >= 0 && canDisplace(m, grid[s2])) { swap(i, s2); return; }
        }
    }
    function simGas(x, y, i, m) {
        const a = idx(x, y-1);
        if (a >= 0 && (grid[a] === MAT.EMPTY || (PROPS[grid[a]]?.t === 3))) { swap(i, a); return; }
        const d = rng() < 0.5 ? 1 : -1;
        const d1 = idx(x+d, y-1);
        if (d1 >= 0 && grid[d1] === MAT.EMPTY) { swap(i, d1); return; }
        const s1 = idx(x+d, y);
        if (s1 >= 0 && grid[s1] === MAT.EMPTY) swap(i, s1);
    }

    function simInteract(x, y, i, m) {
        // Lifetime-based materials
        if (m === MAT.FIRE || m === MAT.STEAM || m === MAT.SMOKE || m === MAT.EMBER) {
            life[i]--;
            if (life[i] <= 0) {
                if (m === MAT.FIRE) setCell(i, rng()<0.25 ? MAT.SMOKE : MAT.EMPTY);
                else if (m === MAT.STEAM) setCell(i, rng()<0.35 ? MAT.WATER : MAT.EMPTY);
                else if (m === MAT.EMBER) setCell(i, MAT.EMPTY);
                else setCell(i, MAT.EMPTY);
                return;
            }
            // Fire flicker color
            if (m === MAT.FIRE) color[i] = matColor(MAT.FIRE);
            if (m === MAT.EMBER) color[i] = matColor(MAT.EMBER);
        }

        // Check neighbors for reactions
        const nb = [idx(x,y-1), idx(x,y+1), idx(x-1,y), idx(x+1,y)];
        for (let k = 0; k < 4; k++) {
            const ni = nb[k];
            if (ni < 0) continue;
            const nm = grid[ni];
            if (nm === MAT.EMPTY) continue;

            // Fire/Lava ignites flammable
            if ((m === MAT.FIRE || m === MAT.LAVA || m === MAT.EMBER) && PROPS[nm]?.fl && rng() < 0.04) {
                setCell(ni, MAT.FIRE);
            }
            // Fire + Water = Steam
            if (m === MAT.FIRE && nm === MAT.WATER) { setCell(i, MAT.EMPTY); setCell(ni, MAT.STEAM); return; }
            // Lava + Water = Stone + Steam
            if (m === MAT.LAVA && nm === MAT.WATER) { setCell(i, MAT.STONE); setCell(ni, MAT.STEAM); return; }
            // Water + Fire = Steam
            if (m === MAT.WATER && nm === MAT.FIRE) { setCell(ni, MAT.STEAM); setCell(i, MAT.EMPTY); return; }
            // Lava + Ice = Stone + Water
            if (m === MAT.LAVA && nm === MAT.ICE) { setCell(i, MAT.STONE); setCell(ni, MAT.WATER); return; }
            // Fire + Ice = Water
            if ((m === MAT.FIRE || m === MAT.EMBER) && nm === MAT.ICE && rng()<0.08) { setCell(ni, MAT.WATER); }
            // Acid dissolves non-resistant materials
            if (m === MAT.ACID && !PROPS[nm]?.ar && nm !== MAT.EMPTY && rng() < 0.06) {
                setCell(ni, MAT.EMPTY);
                if (rng()<0.4) setCell(i, rng()<0.5 ? MAT.SMOKE : MAT.EMPTY);
                return;
            }
            // Gunpowder near fire/lava/ember = EXPLOSION
            if (m === MAT.GUNPOWDER && (nm === MAT.FIRE || nm === MAT.LAVA || nm === MAT.EMBER)) {
                explode(x, y, 10 + (rng()*6|0));
                return;
            }
        }
    }

    function explode(cx, cy, radius) {
        const r2 = radius * radius;
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                const d2 = dx*dx + dy*dy;
                if (d2 > r2) continue;
                const ni = idx(cx+dx, cy+dy);
                if (ni < 0 || grid[ni] === MAT.BEDROCK) continue;
                const ratio = Math.sqrt(d2) / radius;
                if (ratio < 0.55) {
                    setCell(ni, MAT.EMPTY);
                } else if (ratio < 0.8) {
                    if (PROPS[grid[ni]]?.fl) setCell(ni, MAT.FIRE);
                    else if (grid[ni] !== MAT.EMPTY) setCell(ni, MAT.EMBER);
                } else {
                    if (PROPS[grid[ni]]?.fl && rng()<0.5) setCell(ni, MAT.FIRE);
                }
            }
        }
        if (game) { game.screenShake = 12; game.audio.playExplode(); }
    }

    // =====================================================
    // 6. WORLD GENERATION
    // =====================================================
    function generateWorld() {
        const noise = new Noise2D(2026);
        const noise2 = new Noise2D(1337);
        const noise3 = new Noise2D(5678);
        rngSeed(42);
        grid.fill(MAT.EMPTY);
        color.fill(0);
        clock.fill(0);
        life.fill(0);

        // Pre-compute surface heights
        const surfHeights = new Int32Array(WORLD_W);
        for (let x = 0; x < WORLD_W; x++) {
            const surfNoise = noise.noise(x * 0.015, 0) * 22 + noise.noise(x * 0.06, 10) * 8;
            surfHeights[x] = Math.floor(WORLD_H * 0.3 + surfNoise);
        }

        for (let x = 0; x < WORLD_W; x++) {
            const surfY = surfHeights[x];

            for (let y = 0; y < WORLD_H; y++) {
                const i = y * WORLD_W + x;
                if (y >= WORLD_H - 3) { setCell(i, MAT.BEDROCK); continue; }
                if (y < surfY) continue; // sky

                if (y === surfY) { setCell(i, MAT.GRASS); }
                else if (y < surfY + 5) { setCell(i, MAT.DIRT); }
                else {
                    // Underground
                    const caveN = noise.noise(x * 0.05, y * 0.05);
                    const caveN2 = noise2.noise(x * 0.08, y * 0.08);
                    if (caveN > 0.25 && caveN2 > -0.1) {
                        // Cave - sprinkle water in deep caves
                        if (y > WORLD_H * 0.75 && rng() < 0.025) setCell(i, MAT.LAVA);
                        else if (y > WORLD_H * 0.5 && rng() < 0.02) setCell(i, MAT.WATER);
                        continue;
                    }
                    // Minerals and ore veins
                    const mn = noise2.noise(x * 0.12, y * 0.12);
                    const mn3 = noise3.noise(x * 0.18, y * 0.18);
                    if (mn > 0.45 && y > surfY + 20) setCell(i, MAT.SAND);
                    else if (mn3 > 0.55 && y > surfY + 15) setCell(i, MAT.GLASS); // quartz veins
                    else if (y > WORLD_H * 0.65 && rng() < 0.004) setCell(i, MAT.LAVA);
                    else setCell(i, MAT.STONE);
                }
            }
        }

        // Surface water lakes in valleys
        rngSeed(777);
        for (let x = 10; x < WORLD_W - 10; x++) {
            // Find valley spots (where surface is lower than neighbors)
            const sy = surfHeights[x];
            const syL = surfHeights[Math.max(0, x-5)];
            const syR = surfHeights[Math.min(WORLD_W-1, x+5)];
            if (sy > syL && sy > syR && rng() < 0.15) {
                // Place water above surface in valley
                for (let wy = sy - 1; wy >= sy - 4; wy--) {
                    const wi = idx(x, wy);
                    if (wi >= 0 && grid[wi] === MAT.EMPTY) setCell(wi, MAT.WATER);
                }
            }
        }

        // Trees
        rngSeed(1005);
        for (let x = 5; x < WORLD_W - 5; x++) {
            if (rng() > 0.06) continue;
            let sy = -1;
            for (let y = 0; y < WORLD_H; y++) { if (grid[y*WORLD_W+x] !== MAT.EMPTY) { sy = y; break; } }
            if (sy < 0 || grid[sy*WORLD_W+x] !== MAT.GRASS) continue;
            // Check not in water
            const aboveI = idx(x, sy - 1);
            if (aboveI >= 0 && grid[aboveI] === MAT.WATER) continue;
            const th = 5 + (rng()*5|0);
            for (let t = 1; t <= th; t++) { const ti = idx(x, sy-t); if(ti>=0) setCell(ti, MAT.WOOD); }
            // Leafy canopy
            const canopyR = 2 + (rng()*2|0);
            for (let lx = -canopyR; lx <= canopyR; lx++) {
                for (let ly = -canopyR; ly <= 1; ly++) {
                    if (Math.abs(lx)+Math.abs(ly) > canopyR + 1) continue;
                    const li = idx(x+lx, sy-th+ly);
                    if (li >= 0 && grid[li] === MAT.EMPTY) setCell(li, MAT.GRASS);
                }
            }
            x += 3 + (rng()*3|0);
        }

        // Surface gunpowder deposits (Easter egg)
        rngSeed(9999);
        for (let x = 20; x < WORLD_W - 20; x += 40 + (rng()*30|0)) {
            const sy = surfHeights[x];
            for (let gy = sy + 8; gy < sy + 14; gy++) {
                for (let gx = x - 2; gx <= x + 2; gx++) {
                    const gi = idx(gx, gy);
                    if (gi >= 0 && grid[gi] === MAT.STONE && rng() < 0.5) setCell(gi, MAT.GUNPOWDER);
                }
            }
        }
    }

    // =====================================================
    // 7. PLAYER CONTROLLER
    // =====================================================
    class Player {
        constructor(id, keymap) {
            this.id = id;
            this.x = 0; this.y = 0;
            this.vx = 0; this.vy = 0;
            this.ax = 0; this.jumpReq = false;
            this.onGround = false;
            this.hp = MAX_HP;
            this.tool = TOOL_PLACE;
            this.selectedMat = MAT.SAND;
            this.facing = 1;
            this.keymap = keymap;
            this.dmgTimer = 0;
        }

        spawn() {
            this.x = WORLD_W * (this.id === 0 ? 0.5 : 0.6);
            for (let y = 0; y < WORLD_H; y++) {
                if (grid[y * WORLD_W + (this.x|0)] !== MAT.EMPTY) {
                    this.y = y - PLAYER_H - 1;
                    break;
                }
            }
            this.vx = 0; this.vy = 0; this.hp = MAX_HP;
        }

        update() {
            // Acceleration
            this.vx += this.ax * PLAYER_SPEED * 0.3;
            this.vx *= 0.82;
            if (Math.abs(this.vx) < 0.05) this.vx = 0;
            if (this.vx !== 0) this.facing = this.vx > 0 ? 1 : -1;

            // Jump
            if (this.jumpReq && this.onGround) { this.vy = PLAYER_JUMP; this.onGround = false; }
            this.jumpReq = false;

            // In liquid?
            const cx = (this.x + PLAYER_W/2)|0, cy = (this.y + PLAYER_H/2)|0;
            const ci = idx(cx, cy);
            const inLiquid = ci >= 0 && PROPS[grid[ci]]?.t === 3;
            if (inLiquid) {
                this.vy += GRAVITY * 0.25;
                this.vy *= 0.9;
                if (this.jumpReq || this.ax !== 0) this.vy -= 0.8; // swim
                
                // Clean water heals player slowly
                if (grid[ci] === MAT.WATER && this.hp < MAX_HP && this.dmgTimer <= 0) {
                    this.hp = Math.min(MAX_HP, this.hp + 2);
                    this.dmgTimer = 15;
                    if (game) {
                        game.spawnFloatingText(this.x + PLAYER_W/2, this.y, "+2 HP", "#2ed573");
                        if (game.activeMission && game.activeMission.type === 'heal_water') {
                            game.missionProgress += 2;
                            game.updateMissionUI();
                            game.checkMissionComplete();
                        }
                    }
                }
            } else {
                this.vy += GRAVITY;
            }
            if (this.vy > 8) this.vy = 8;

            // Move X
            this.x += this.vx;
            this.x = ((this.x % WORLD_W) + WORLD_W) % WORLD_W;
            this.resolveX();

            // Move Y
            this.y += this.vy;
            this.resolveY();

            // Clamp Y
            if (this.y < 0) { this.y = 0; this.vy = 0; }
            if (this.y > WORLD_H - PLAYER_H - 2) { this.y = WORLD_H - PLAYER_H - 2; this.vy = 0; this.onGround = true; }

            // Damage from environment
            this.dmgTimer--;
            if (this.dmgTimer <= 0) {
                for (let dy = 0; dy < PLAYER_H; dy++) {
                    for (let dx = 0; dx < PLAYER_W; dx++) {
                        const pi = idx((this.x+dx)|0, (this.y+dy)|0);
                        if (pi < 0) continue;
                        const pm = grid[pi];
                        if (pm === MAT.FIRE || pm === MAT.LAVA || pm === MAT.ACID) {
                            this.hp -= (pm === MAT.LAVA ? 3 : pm === MAT.ACID ? 2 : 1);
                            this.dmgTimer = 10;
                            break;
                        }
                    }
                    if (this.dmgTimer > 0) break;
                }
            }
            if (this.hp <= 0) {
                this.hp = MAX_HP;
                this.spawn();
                // Respawn flash effect
                const flash = document.getElementById('respawn-flash');
                if (flash) { flash.style.opacity = '1'; setTimeout(() => { flash.style.transition='opacity 0.6s'; flash.style.opacity='0'; setTimeout(()=>{ flash.style.transition='opacity 0.05s'; }, 650); }, 80); }
            }
        }

        isSolid(x, y) {
            const i = idx(x|0, y|0);
            if (i < 0) return true;
            const t = PROPS[grid[i]]?.t;
            return t === 1 || t === 2; // solid or powder
        }

        resolveX() {
            for (let dy = 0; dy < PLAYER_H; dy++) {
                for (let dx = 0; dx < PLAYER_W; dx++) {
                    if (this.isSolid(this.x + dx, this.y + dy)) {
                        if (this.vx > 0) this.x = Math.floor(this.x + dx) - dx - 0.01;
                        else if (this.vx < 0) this.x = Math.floor(this.x + dx) + 1 - dx + 0.01;
                        this.vx = 0;
                        return;
                    }
                }
            }
        }

        resolveY() {
            this.onGround = false;
            for (let dy = 0; dy < PLAYER_H; dy++) {
                for (let dx = 0; dx < PLAYER_W; dx++) {
                    if (this.isSolid(this.x + dx, this.y + dy)) {
                        if (this.vy > 0) {
                            this.y = Math.floor(this.y + dy) - dy - 0.01;
                            this.vy = 0;
                            this.onGround = true;
                        } else if (this.vy < 0) {
                            this.y = Math.floor(this.y + dy) + 1 - dy + 0.01;
                            this.vy = 0;
                        }
                        return;
                    }
                }
            }
        }

        draw(ctx, cam) {
            const sx = (this.x - cam.x) * cam.zoom;
            const sy = (this.y - cam.y) * cam.zoom;
            const sw = PLAYER_W * cam.zoom;
            const sh = PLAYER_H * cam.zoom;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(sx-1, sy+sh-2, sw+2, 3);

            // Body
            ctx.fillStyle = this.id === 0 ? '#ff6b6b' : '#6baaff';
            ctx.fillRect(sx, sy + sh*0.3, sw, sh*0.5);

            // Head
            ctx.fillStyle = '#ffe0c0';
            ctx.beginPath();
            ctx.arc(sx + sw/2, sy + sh*0.22, sw*0.45, 0, Math.PI*2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#333';
            const ex = this.facing > 0 ? sw*0.6 : sw*0.25;
            ctx.fillRect(sx + ex, sy + sh*0.18, 2, 2);

            // HP bar above player
            const hpW = sw + 4;
            const hpRatio = this.hp / MAX_HP;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(sx - 2, sy - 6, hpW, 3);
            ctx.fillStyle = hpRatio > 0.5 ? '#2ed573' : hpRatio > 0.25 ? '#ffa502' : '#ff4757';
            ctx.fillRect(sx - 2, sy - 6, hpW * hpRatio, 3);
        }
    }

    // =====================================================
    // 8. SOUND SYNTHESIZER
    // =====================================================
    class Audio {
        constructor() { this.ctx = null; this.muted = false; this.musicMuted = false; this.musicTimer = null; }
        init() { if (!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }
        _play(type, f1, f2, dur, vol) {
            if (this.muted) return;
            this.init();
            if (this.ctx.state==='suspended') this.ctx.resume();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(f1, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(f2,1), now+dur);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.linearRampToValueAtTime(0.01, now+dur);
            osc.start(now); osc.stop(now+dur);
        }
        playPlace() { this._play('sine', 280, 180, 0.08, 0.12); }
        playMine() { this._play('sawtooth', 90+rng()*30, 30, 0.06, 0.1); }
        playBreak() { this._play('sawtooth', 110, 20, 0.12, 0.18); }
        playJump() { this._play('sine', 160, 360, 0.1, 0.1); }
        playExplode() {
            this._play('sawtooth', 80, 15, 0.3, 0.25);
            this._play('square', 60, 10, 0.25, 0.15);
        }
        playMissionComplete() {
            if (this.muted) return;
            this.init();
            if (this.ctx.state==='suspended') this.ctx.resume();
            const now = this.ctx.currentTime;
            const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                gain.gain.setValueAtTime(0.06, now + idx * 0.08);
                gain.gain.linearRampToValueAtTime(0.005, now + idx * 0.08 + 0.2);
                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.2);
            });
        }
        startMusic() {
            if (this.musicTimer) return;
            this.init();
            const progressions = [
                [
                    [110.00, 130.81, 164.81, 196.00, 246.94], // Am9
                    [87.31, 130.81, 174.61, 220.00, 261.63], // Fmaj7
                    [130.81, 164.81, 196.00, 261.63, 329.63], // Cmaj7
                    [98.00, 146.83, 196.00, 246.94, 293.66]  // G6
                ],
                [
                    [146.83, 174.61, 220.00, 261.63, 329.63], // Dm9
                    [98.00, 146.83, 196.00, 246.94, 392.00],  // G7
                    [130.81, 164.81, 196.00, 261.63, 329.63], // Cmaj7
                    [130.81, 164.81, 196.00, 261.63, 329.63]  // Cmaj7
                ]
            ];
            let progIdx = 0, chordIdx = 0;
            const playNextChord = () => {
                if (this.muted || this.musicMuted) return;
                this.init();
                if (this.ctx.state==='suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const prog = progressions[progIdx];
                const chord = prog[chordIdx];
                chord.forEach((freq) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    const vol = 0.025 / chord.length;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(vol, now + 1.2);
                    gain.gain.setValueAtTime(vol, now + 2.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 4.5);
                    osc.start(now); osc.stop(now + 4.5);
                });
                if (rng() < 0.75) {
                    const melody = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
                    const note = melody[Math.floor(rng() * melody.length)];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    const delay = 0.5 + rng() * 1.5;
                    osc.frequency.setValueAtTime(note, now + delay);
                    gain.gain.setValueAtTime(0, now + delay);
                    gain.gain.linearRampToValueAtTime(0.012, now + delay + 0.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 2.5);
                    osc.start(now + delay); osc.stop(now + delay + 2.5);
                }
                chordIdx = (chordIdx + 1) % prog.length;
                if (chordIdx === 0) progIdx = (progIdx + 1) % progressions.length;
            };
            playNextChord();
            this.musicTimer = setInterval(playNextChord, 4000);
        }
        stopMusic() {
            if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; }
        }
    }

    // =====================================================
    // 9. CAMERA SYSTEM
    // =====================================================
    class Camera {
        constructor() { this.x = 0; this.y = 0; this.zoom = 3; this.viewW = 0; this.viewH = 0; }
        resize(sw, sh) {
            this.zoom = Math.max(2, Math.min(4, Math.floor(Math.min(sw, sh) / 160)));
            this.viewW = sw / this.zoom;
            this.viewH = sh / this.zoom;
        }
        follow(px, py, dt) {
            const tx = px + PLAYER_W/2 - this.viewW/2;
            const ty = py + PLAYER_H/2 - this.viewH/2;
            const f = 1 - Math.pow(0.02, dt);
            this.x += (tx - this.x) * f;
            this.y += (ty - this.y) * f;
            this.y = Math.max(0, Math.min(this.y, WORLD_H - this.viewH));
            // X wraps, no clamping needed but keep in range for rendering
            if (this.x < 0) this.x += WORLD_W;
            if (this.x >= WORLD_W) this.x -= WORLD_W;
        }
    }

    // =====================================================
    // 10. MULTIPLAYER MANAGER
    // =====================================================
    class Multiplayer {
        constructor() {
            this.mode = 'solo'; // solo, local, online
            this.pc = null;
            this.dc = null;
            this.isHost = false;
            this.connected = false;
            this.remoteInputs = { ax:0, jump:false, actions:[] };
        }
        startLocal() {
            this.mode = 'local';
            document.getElementById('mp-status').textContent = 'Pantalla dividida activa';
            document.getElementById('v-mode').textContent = 'Local 2P';
        }
        async host() {
            this.isHost = true; this.mode = 'online';
            const cfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            this.pc = new RTCPeerConnection(cfg);
            this.dc = this.pc.createDataChannel('g', { ordered: false, maxRetransmits: 0 });
            this._setupDC(this.dc);
            this.pc.onicecandidate = () => {};
            const offer = await this.pc.createOffer();
            await this.pc.setLocalDescription(offer);
            // Wait for ICE gathering
            await new Promise(r => {
                if (this.pc.iceGatheringState === 'complete') r();
                else this.pc.onicegatheringstatechange = () => { if (this.pc.iceGatheringState === 'complete') r(); };
            });
            const code = btoa(JSON.stringify(this.pc.localDescription));
            const ta = document.getElementById('mp-code');
            ta.style.display = 'block';
            ta.value = code;
            document.getElementById('mp-actions').style.display = 'flex';
            document.getElementById('mp-status').textContent = 'Esperando jugador... Copia y comparte el codigo';
        }
        async join(offerCode) {
            this.mode = 'online';
            const cfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            this.pc = new RTCPeerConnection(cfg);
            this.pc.ondatachannel = e => { this.dc = e.channel; this._setupDC(this.dc); };
            const offer = JSON.parse(atob(offerCode));
            await this.pc.setRemoteDescription(offer);
            const answer = await this.pc.createAnswer();
            await this.pc.setLocalDescription(answer);
            await new Promise(r => {
                if (this.pc.iceGatheringState === 'complete') r();
                else this.pc.onicegatheringstatechange = () => { if (this.pc.iceGatheringState === 'complete') r(); };
            });
            const code = btoa(JSON.stringify(this.pc.localDescription));
            const ta = document.getElementById('mp-code');
            ta.value = code;
            document.getElementById('mp-status').textContent = 'Respuesta lista. Copia y enviale al host';
        }
        async applyAnswer(answerCode) {
            const answer = JSON.parse(atob(answerCode));
            await this.pc.setRemoteDescription(answer);
        }
        _setupDC(dc) {
            dc.onopen = () => {
                this.connected = true;
                document.getElementById('mp-status').textContent = 'Conectado!';
                document.getElementById('v-mode').textContent = 'Online P2P';
            };
            dc.onmessage = e => {
                try { this.remoteInputs = JSON.parse(e.data); } catch(ex){}
            };
            dc.onclose = () => {
                this.connected = false;
                document.getElementById('mp-status').textContent = 'Desconectado';
            };
        }
        send(data) {
            if (this.dc && this.dc.readyState === 'open') {
                try { this.dc.send(JSON.stringify(data)); } catch(ex){}
            }
        }
    }

    // =====================================================
    // 10.5 JUICE & FEEDBACK: FLOATING TEXT
    // =====================================================
    class FloatingText {
        constructor(x, y, text, color) {
            this.x = x; this.y = y; this.text = text; this.color = color;
            this.life = 50;
            this.vy = -0.6 - rng()*0.5;
            this.vx = (rng()-0.5)*0.3;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life--; }
        draw(ctx, cam) {
            const sx = (this.x - cam.x) * cam.zoom;
            const sy = (this.y - cam.y) * cam.zoom;
            const alpha = Math.min(1, this.life / 15);
            ctx.save();
            ctx.font = `bold ${Math.floor(9 * cam.zoom)}px sans-serif`;
            ctx.fillStyle = this.color;
            ctx.globalAlpha = alpha;
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 3;
            ctx.textAlign = 'center';
            ctx.fillText(this.text, sx, sy);
            ctx.restore();
        }
    }

    // =====================================================
    // 11. GAME CLASS
    // =====================================================
    let game = null;

    class Game {
        constructor() {
            this.canvas = document.getElementById('gameCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.offCanvas = document.createElement('canvas');
            this.offCanvas.width = WORLD_W;
            this.offCanvas.height = WORLD_H;
            this.offCtx = this.offCanvas.getContext('2d');
            this.imgData = this.offCtx.createImageData(WORLD_W, WORLD_H);
            this.pixels32 = new Uint32Array(this.imgData.data.buffer);
            this.bgNoise = new Noise2D(90);

            this.players = [new Player(0, { l:'KeyA', r:'KeyD', u:'KeyW', d:'KeyS', j:'KeyW' })];
            this.cam = new Camera();
            this.audio = new Audio();
            this.mp = new Multiplayer();

            this.keys = {};
            this.joystick = { active:false, pid:null, sx:0, sy:0, cx:0, cy:0, rad:50, threshold:8 };
            this.pointers = {};
            this.screenShake = 0;
            this.skyTime = 6000;
            this.fps = 0;
            this.simTime = 0;
            this.drawTime = 0;

            this.currentTool = TOOL_PLACE;
            this.currentMat = MAT.SAND;
            this.brushSize = 3;

            this.floatingTexts = [];
            this.score = 0;
            this.activeMission = null;
            this.missionProgress = 0;
            this.missionTimeCounter = 0;

            this.cursor = { x: -9999, y: -9999, visible: false }; // world-space cursor
            this.init();
        }

        init() {
            this.resize();
            window.addEventListener('resize', () => this.resize());
            generateWorld();
            this.players[0].spawn();
            this.setupPalette();
            this.setupTools();
            this.setupBrushSlider();
            this.setupEvents();
            this.setupMPPanel();
            this.selectRandomMission();
            setTimeout(() => { const t = document.getElementById('tutorial'); if(t) t.style.opacity = 0; }, 5000);
        }

        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
            this.cam.resize(this.canvas.width, this.canvas.height);
        }

        setupPalette() {
            const cont = document.getElementById('palette');
            cont.innerHTML = '';
            PALETTE.forEach((m, i) => {
                const btn = document.createElement('div');
                btn.className = `mat-btn${i===0?' sel':''}`;
                btn.style.background = matCSS(m);
                btn.innerHTML = `<span class="mat-label">${PROPS[m].n}</span>`;
                btn.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('sel'));
                    btn.classList.add('sel');
                    this.currentMat = m;
                    this.players[0].selectedMat = m;
                    this.audio.playPlace();
                });
                cont.appendChild(btn);
            });
        }

        setupTools() {
            const cont = document.getElementById('tools');
            cont.innerHTML = '';
            TOOL_ICONS.forEach((icon, i) => {
                const btn = document.createElement('button');
                btn.className = `btn${i===0?' active':''}`;
                btn.textContent = icon;
                btn.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    document.querySelectorAll('#tools .btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    this.currentTool = i;
                    this.players[0].tool = i;
                });
                cont.appendChild(btn);
            });
        }

        setupBrushSlider() {
            const slider = document.getElementById('brush-slider');
            const val = document.getElementById('brush-val');
            if (!slider) return;
            slider.addEventListener('input', () => {
                this.brushSize = parseInt(slider.value);
                val.textContent = slider.value;
            });
            slider.addEventListener('pointerdown', e => e.stopPropagation());
        }

        setupMPPanel() {
            document.getElementById('btn-mp').addEventListener('pointerdown', e => {
                e.stopPropagation();
                document.getElementById('mp-panel').classList.toggle('show');
            });
            document.getElementById('mp-local').addEventListener('pointerdown', e => {
                e.stopPropagation();
                this.mp.startLocal();
                if (this.players.length < 2) {
                    const p2 = new Player(1, { l:'ArrowLeft', r:'ArrowRight', u:'ArrowUp', d:'ArrowDown', j:'ArrowUp' });
                    p2.spawn();
                    this.players.push(p2);
                }
            });
            document.getElementById('mp-host').addEventListener('pointerdown', e => { e.stopPropagation(); this.mp.host(); });
            document.getElementById('mp-join').addEventListener('pointerdown', e => {
                e.stopPropagation();
                const code = document.getElementById('mp-code').value.trim();
                if (code) this.mp.join(code);
                else { document.getElementById('mp-code').style.display='block'; document.getElementById('mp-actions').style.display='flex'; document.getElementById('mp-status').textContent = 'Pega el codigo del host y presiona Aplicar'; }
            });
            document.getElementById('mp-copy').addEventListener('pointerdown', e => {
                e.stopPropagation();
                navigator.clipboard?.writeText(document.getElementById('mp-code').value);
                document.getElementById('mp-status').textContent = 'Copiado!';
            });
            document.getElementById('mp-apply').addEventListener('pointerdown', e => {
                e.stopPropagation();
                const code = document.getElementById('mp-code').value.trim();
                if (this.mp.isHost) this.mp.applyAnswer(code);
                else this.mp.join(code);
            });
        }

        selectRandomMission() {
            const list = [
                { type: 'mine_glass', desc: 'Mina 10 bloques de Cristal', target: 10 },
                { type: 'mine_gunpowder', desc: 'Mina 5 depósitos de Pólvora', target: 5 },
                { type: 'survive_deep', desc: 'Sobrevive 12s en la profundidad', target: 12 },
                { type: 'heal_water', desc: 'Cúrate 20 HP en el Agua', target: 20 }
            ];
            const idx = Math.floor(rng() * list.length);
            this.activeMission = list[idx];
            this.missionProgress = 0;
            this.missionTimeCounter = 0;
            this.updateMissionUI();
        }

        updateMissionUI() {
            const display = document.getElementById('mission-display');
            if (display && this.activeMission) {
                display.textContent = `Misión: ${this.activeMission.desc} (${Math.min(this.missionProgress, this.activeMission.target)}/${this.activeMission.target})`;
            }
        }

        checkMissionComplete() {
            if (this.activeMission && this.missionProgress >= this.activeMission.target) {
                this.score += 100;
                document.getElementById('v-score').textContent = this.score;
                this.audio.playMissionComplete();
                const p = this.players[0];
                this.spawnFloatingText(p.x + PLAYER_W/2, p.y - 10, "¡MISIÓN COMPLETADA! +100 pts 🎉", "#ffd700");
                this.screenShake = 6;
                const panel = document.getElementById('mission-panel');
                if (panel) {
                    panel.style.backgroundColor = 'rgba(255, 215, 0, 0.25)';
                    setTimeout(() => { panel.style.backgroundColor = ''; }, 300);
                }
                this.selectRandomMission();
            } else {
                this.updateMissionUI();
            }
        }

        spawnFloatingText(x, y, text, color) {
            this.floatingTexts.push(new FloatingText(x, y, text, color));
        }

        setupEvents() {
            this.canvas.addEventListener('pointerdown', e => this.onPtrDown(e));
            this.canvas.addEventListener('pointermove', e => this.onPtrMove(e));
            this.canvas.addEventListener('pointerup', e => this.onPtrUp(e));
            this.canvas.addEventListener('pointercancel', e => this.onPtrUp(e));
            window.addEventListener('keydown', e => {
                this.keys[e.code] = true;
                // Number keys for material
                if (e.key >= '1' && e.key <= '9') {
                    const idx = parseInt(e.key)-1;
                    if (idx < PALETTE.length) {
                        this.currentMat = PALETTE[idx];
                        this.players[0].selectedMat = PALETTE[idx];
                        document.querySelectorAll('.mat-btn').forEach((b,i)=>{b.classList.toggle('sel',i===idx);});
                    }
                }
                if (e.code === 'KeyE') {
                    this.currentTool = (this.currentTool + 1) % 3;
                    document.querySelectorAll('#tools .btn').forEach((b,i)=>{b.classList.toggle('active',i===this.currentTool);});
                }
            });
            window.addEventListener('keyup', e => { this.keys[e.code] = false; });
            document.getElementById('btn-sound').addEventListener('pointerdown', e => {
                e.stopPropagation();
                this.audio.muted = !this.audio.muted;
                e.target.textContent = this.audio.muted ? '🔇' : '🔊';
            });
            const btnMusic = document.getElementById('btn-music');
            if (btnMusic) {
                btnMusic.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    this.audio.musicMuted = !this.audio.musicMuted;
                    btnMusic.textContent = this.audio.musicMuted ? '🔇🎵' : '🎵';
                    if (!this.audio.musicMuted) this.audio.startMusic();
                    else this.audio.stopMusic();
                });
            }
            const startOnInteraction = () => {
                if (!this.audio.musicTimer && !this.audio.musicMuted) {
                    this.audio.startMusic();
                }
                window.removeEventListener('pointerdown', startOnInteraction);
                window.removeEventListener('keydown', startOnInteraction);
            };
            window.addEventListener('pointerdown', startOnInteraction);
            window.addEventListener('keydown', startOnInteraction);

            document.getElementById('btn-reset').addEventListener('pointerdown', e => {
                e.stopPropagation();
                this.players.forEach(p => p.spawn());
            });
        }

        onPtrDown(e) {
            e.preventDefault();
            try { e.target.setPointerCapture(e.pointerId); } catch(ex){}
            this.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
            if (e.clientX < window.innerWidth / 2.5) {
                if (!this.joystick.active) {
                    this.joystick.active = true;
                    this.joystick.pid = e.pointerId;
                    this.joystick.sx = e.clientX; this.joystick.sy = e.clientY;
                    this.joystick.cx = e.clientX; this.joystick.cy = e.clientY;
                }
            } else {
                this.cursor.visible = true;
                this.cursor.x = (e.clientX / this.cam.zoom + this.cam.x);
                this.cursor.y = (e.clientY / this.cam.zoom + this.cam.y);
                this.doAction(e.clientX, e.clientY);
            }
        }
        onPtrMove(e) {
            e.preventDefault();
            if (!this.pointers[e.pointerId]) return;
            this.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
            if (this.joystick.active && this.joystick.pid === e.pointerId) {
                this.joystick.cx = e.clientX; this.joystick.cy = e.clientY;
                const dx = this.joystick.cx - this.joystick.sx;
                const dy = this.joystick.cy - this.joystick.sy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > this.joystick.threshold) {
                    this.players[0].ax = Math.max(-1, Math.min(dx / this.joystick.rad, 1));
                    if (dy < -this.joystick.rad * 0.65) this.players[0].jumpReq = true;
                } else {
                    this.players[0].ax = 0;
                }
            } else {
                this.cursor.visible = true;
                this.cursor.x = (e.clientX / this.cam.zoom + this.cam.x);
                this.cursor.y = (e.clientY / this.cam.zoom + this.cam.y);
                this.doAction(e.clientX, e.clientY);
            }
        }
        onPtrUp(e) {
            e.preventDefault();
            try { e.target.releasePointerCapture(e.pointerId); } catch(ex){}
            delete this.pointers[e.pointerId];
            if (this.joystick.active && this.joystick.pid === e.pointerId) {
                this.joystick.active = false;
                this.joystick.pid = null;
                this.players[0].ax = 0;
            }
            // Hide cursor if no more right-side touches
            const rightTouches = Object.values(this.pointers).filter(p => p.x >= window.innerWidth / 2.5);
            if (rightTouches.length === 0) this.cursor.visible = false;
        }

        doAction(screenX, screenY) {
            const wx = (screenX / this.cam.zoom + this.cam.x) | 0;
            const wy = (screenY / this.cam.zoom + this.cam.y) | 0;
            const p = this.players[0];
            const pcx = p.x + PLAYER_W/2, pcy = p.y + PLAYER_H/2;
            const dist = Math.sqrt((wx-pcx)**2 + (wy-pcy)**2);
            if (dist > INTERACTION_RANGE) return;

            if (this.currentTool === TOOL_PLACE) {
                const bs = this.brushSize;
                for (let dy = -bs; dy <= bs; dy++) {
                    for (let dx = -bs; dx <= bs; dx++) {
                        if (dx*dx+dy*dy > bs*bs) continue;
                        const ti = idx(wx+dx, wy+dy);
                        if (ti >= 0 && grid[ti] === MAT.EMPTY) {
                            setCell(ti, this.currentMat);
                        }
                    }
                }
                this.audio.playPlace();
            } else if (this.currentTool === TOOL_MINE) {
                const bs = this.brushSize;
                let minedGlass = 0;
                let minedGunpowder = 0;
                for (let dy = -bs; dy <= bs; dy++) {
                    for (let dx = -bs; dx <= bs; dx++) {
                        if (dx*dx+dy*dy > bs*bs) continue;
                        const ti = idx(wx+dx, wy+dy);
                        if (ti >= 0 && grid[ti] !== MAT.EMPTY && grid[ti] !== MAT.BEDROCK) {
                            const tm = grid[ti];
                            if (tm === MAT.GLASS) minedGlass++;
                            else if (tm === MAT.GUNPOWDER) minedGunpowder++;
                            setCell(ti, MAT.EMPTY);
                        }
                    }
                }
                if (minedGlass > 0) {
                    this.score += minedGlass * 10;
                    document.getElementById('v-score').textContent = this.score;
                    this.spawnFloatingText(wx, wy, `+${minedGlass * 10} Cristal`, "#ffd700");
                    if (this.activeMission && this.activeMission.type === 'mine_glass') {
                        this.missionProgress += minedGlass;
                        this.checkMissionComplete();
                    }
                }
                if (minedGunpowder > 0) {
                    this.score += minedGunpowder * 5;
                    document.getElementById('v-score').textContent = this.score;
                    this.spawnFloatingText(wx, wy, `+${minedGunpowder * 5} Pólvora`, "#ff4757");
                    if (this.activeMission && this.activeMission.type === 'mine_gunpowder') {
                        this.missionProgress += minedGunpowder;
                        this.checkMissionComplete();
                    }
                }
                this.audio.playMine();
            } else if (this.currentTool === TOOL_BOMB) {
                explode(wx, wy, 12 + (rng()*5|0));
            }
        }

        update(dt) {
            // Keyboard input for players
            this.players.forEach(p => {
                const k = p.keymap;
                if (p.id === 0 && this.joystick.active) {
                    // Touch joystick overrides keyboard for P1
                } else {
                    p.ax = 0;
                    if (this.keys[k.l]) p.ax = -1;
                    else if (this.keys[k.r]) p.ax = 1;
                    if (this.keys[k.j]) p.jumpReq = true;
                }
                p.update();
            });

            // Online multiplayer input sync
            if (this.mp.connected) {
                const p = this.players[0];
                this.mp.send({ ax: p.ax, j: p.jumpReq, x: p.x, y: p.y });
                const ri = this.mp.remoteInputs;
                if (this.players.length < 2) {
                    const p2 = new Player(1, {});
                    p2.spawn();
                    this.players.push(p2);
                }
                const rp = this.players[1];
                if (ri.x !== undefined) { rp.x = ri.x; rp.y = ri.y; }
                rp.ax = ri.ax || 0;
                if (ri.j) rp.jumpReq = true;
            }

            // CA Simulation
            simulate();

            // Camera
            this.cam.follow(this.players[0].x, this.players[0].y, dt);

            // Screen shake decay
            if (this.screenShake > 0) this.screenShake *= 0.85;
            if (this.screenShake < 0.5) this.screenShake = 0;

            // Day/night
            this.skyTime = (this.skyTime + dt * 20) % 24000;

            // Update floating texts
            for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                const ft = this.floatingTexts[i];
                ft.update();
                if (ft.life <= 0) this.floatingTexts.splice(i, 1);
            }

            // Track survive deep mission
            if (this.activeMission && this.activeMission.type === 'survive_deep') {
                if (this.players[0].y > WORLD_H * 0.65) {
                    this.missionTimeCounter += dt;
                    if (this.missionTimeCounter >= 1.0) {
                        this.missionProgress++;
                        this.missionTimeCounter = 0;
                        this.checkMissionComplete();
                    }
                }
            }

            // HP UI
            document.getElementById('hp-fill').style.width = `${(this.players[0].hp / MAX_HP) * 100}%`;
        }

        render() {
            const ctx = this.ctx;
            const cw = this.canvas.width, ch = this.canvas.height;

            // Sky gradient
            this.drawSky(ctx, cw, ch);

            // Parallax mountains
            this.drawParallax(ctx, cw, ch);

            // World pixels: copy color buffer to ImageData
            // color[] already stores 0 for EMPTY cells (set in setCell), so direct copy works
            this.pixels32.set(color);

            this.offCtx.putImageData(this.imgData, 0, 0);

            // Draw world to main canvas
            ctx.imageSmoothingEnabled = false;

            const shakeX = this.screenShake ? (rng()-0.5) * this.screenShake * 2 : 0;
            const shakeY = this.screenShake ? (rng()-0.5) * this.screenShake * 2 : 0;

            const sx = this.cam.x;
            const sy = this.cam.y;
            const sw = this.cam.viewW;
            const sh = this.cam.viewH;

            // Handle horizontal wrapping rendering
            const rightOverflow = sx + sw - WORLD_W;
            if (rightOverflow > 0 && sx < WORLD_W) {
                // Draw main portion
                ctx.drawImage(this.offCanvas, sx, sy, sw - rightOverflow, sh, shakeX, shakeY, (sw - rightOverflow) * this.cam.zoom, ch);
                // Draw wrapped portion
                ctx.drawImage(this.offCanvas, 0, sy, rightOverflow, sh, (sw - rightOverflow) * this.cam.zoom + shakeX, shakeY, rightOverflow * this.cam.zoom, ch);
            } else {
                ctx.drawImage(this.offCanvas, sx, sy, sw, sh, shakeX, shakeY, cw, ch);
            }

            // Draw players
            this.players.forEach(p => p.draw(ctx, this.cam));

            // Draw floating texts
            this.floatingTexts.forEach(ft => ft.draw(ctx, this.cam));

            // Draw placement cursor crosshair
            if (this.cursor.visible) this.drawCursor(ctx);

            // Draw joystick
            if (this.joystick.active) this.drawJoystick(ctx);

            // HUD update
            document.getElementById('v-fps').textContent = this.fps|0;
            document.getElementById('v-sim').textContent = this.simTime.toFixed(1);
            document.getElementById('v-draw').textContent = this.drawTime.toFixed(1);
            document.getElementById('v-pos').textContent = `${this.players[0].x|0},${this.players[0].y|0}`;
            document.getElementById('v-cells').textContent = totalCells;
        }

        drawSky(ctx, w, h) {
            const t = this.skyTime;
            let topR, topG, topB, botR, botG, botB;
            if (t >= 4000 && t < 12000) {
                topR=135;topG=206;topB=235; botR=224;botG=246;botB=255;
            } else if (t >= 12000 && t < 16000) {
                const r = (t-12000)/4000;
                topR=135-r*117|0;topG=206-r*190|0;topB=235-r*203|0;
                botR=224-r*13|0;botG=246-r*162|0;botB=255-r*255|0;
            } else if (t >= 16000 || t < 4000) {
                const r = t >= 16000 ? (t-16000)/8000 : (t+8000)/12000;
                topR=13;topG=14;topB=21; botR=5;botG=5;botB=8;
                if (t < 4000) { const rr = t/4000; topR+=rr*122|0;topG+=rr*192|0;topB+=rr*214|0;botR+=rr*219|0;botG+=rr*241|0;botB+=rr*247|0; }
            } else {
                topR=135;topG=206;topB=235; botR=224;botG=246;botB=255;
            }
            const grad = ctx.createLinearGradient(0,0,0,h);
            grad.addColorStop(0, `rgb(${topR},${topG},${topB})`);
            grad.addColorStop(1, `rgb(${botR},${botG},${botB})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,w,h);

            // Stars at night
            if (this.skyTime > 16000 || this.skyTime < 4000) {
                let alpha = 0.6;
                if (this.skyTime >= 14000 && this.skyTime <= 16000) alpha = (this.skyTime-14000)/2000*0.6;
                if (this.skyTime < 4000) alpha = (1 - this.skyTime/4000)*0.6;
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                rngSeed(2026);
                for (let i = 0; i < 50; i++) {
                    ctx.beginPath();
                    ctx.arc(rng()*w, rng()*h*0.6, 0.8+rng()*1.5, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        drawParallax(ctx, w, h) {
            ctx.fillStyle = 'rgba(35,38,58,0.35)';
            ctx.beginPath(); ctx.moveTo(0, h);
            for (let x = 0; x <= w; x += 12) {
                const my = h * 0.7 + this.bgNoise.noise((x + this.cam.x * 0.08) * 0.004, 0) * 100;
                ctx.lineTo(x, my);
            }
            ctx.lineTo(w, h); ctx.fill();

            ctx.fillStyle = 'rgba(50,60,80,0.25)';
            ctx.beginPath(); ctx.moveTo(0, h);
            for (let x = 0; x <= w; x += 12) {
                const my = h * 0.78 + this.bgNoise.noise((x + this.cam.x * 0.2) * 0.006, 50) * 60;
                ctx.lineTo(x, my);
            }
            ctx.lineTo(w, h); ctx.fill();
        }

        drawCursor(ctx) {
            ctx.save();
            const sx = (this.cursor.x - this.cam.x) * this.cam.zoom;
            const sy = (this.cursor.y - this.cam.y) * this.cam.zoom;
            const bs = this.brushSize * this.cam.zoom;
            // Outer ring
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.arc(sx, sy, bs + 2, 0, Math.PI*2);
            ctx.stroke();
            // Inner dot
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(sx, sy, 2, 0, Math.PI*2);
            ctx.fill();
            // Crosshair lines
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            const cLen = 8;
            ctx.beginPath();
            ctx.moveTo(sx - bs - cLen, sy); ctx.lineTo(sx - bs + 4, sy);
            ctx.moveTo(sx + bs - 4, sy); ctx.lineTo(sx + bs + cLen, sy);
            ctx.moveTo(sx, sy - bs - cLen); ctx.lineTo(sx, sy - bs + 4);
            ctx.moveTo(sx, sy + bs - 4); ctx.lineTo(sx, sy + bs + cLen);
            ctx.stroke();
            ctx.restore();
        }

        drawJoystick(ctx) {
            ctx.save();
            const dx = this.joystick.cx - this.joystick.sx;
            const dy = this.joystick.cy - this.joystick.sy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const isJumping = dy < -this.joystick.rad * 0.65;

            // Outer ring with glow when active
            ctx.shadowColor = isJumping ? 'rgba(255,215,0,0.5)' : 'rgba(255,255,255,0.15)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = isJumping ? 'rgba(255,215,0,0.1)' : 'rgba(255,255,255,0.06)';
            ctx.strokeStyle = isJumping ? 'rgba(255,215,0,0.7)' : 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.joystick.sx, this.joystick.sy, this.joystick.rad, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();

            // Direction indicator lines
            if (dist > this.joystick.threshold) {
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(this.joystick.sx, this.joystick.sy);
                ctx.lineTo(this.joystick.cx, this.joystick.cy);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            const a = Math.atan2(dy, dx);
            const d = Math.min(dist, this.joystick.rad);
            const kx = this.joystick.sx + Math.cos(a)*d;
            const ky = this.joystick.sy + Math.sin(a)*d;

            ctx.shadowColor = isJumping ? 'rgba(255,215,0,0.8)' : 'rgba(255,255,255,0.3)';
            ctx.shadowBlur = 16;
            ctx.fillStyle = isJumping ? 'rgba(255,215,0,0.95)' : 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(kx, ky, 20, 0, Math.PI*2);
            ctx.fill();

            // Jump arrow indicator
            if (isJumping) {
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#333';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('↑', kx, ky);
            }
            ctx.restore();
        }
    }

    // =====================================================
    // 12. MAIN LOOP
    // =====================================================
    window.addEventListener('load', () => {
        game = new Game();

        const fixedDt = 1/60;
        let acc = 0, lastT = performance.now();
        let fCount = 0, fpsT = lastT;

        function loop(now) {
            let dt = (now - lastT) / 1000;
            if (dt > 0.2) dt = 0.2;
            lastT = now;

            fCount++;
            if (now - fpsT >= 1000) { game.fps = fCount * 1000 / (now - fpsT); fCount = 0; fpsT = now; }

            const t0 = performance.now();
            acc += dt;
            while (acc >= fixedDt) { game.update(fixedDt); acc -= fixedDt; }
            game.simTime = performance.now() - t0;

            const t1 = performance.now();
            game.render();
            game.drawTime = performance.now() - t1;

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    });
    </script>
</body>
