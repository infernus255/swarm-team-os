<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Project Forge 2D - Sandbox de autómatas celulares estilo Noita con multijugador. Arena, agua, fuego, lava, ácido y más.">
    <title>Project Forge 2D — Noita Sandbox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="respawn-flash"></div>
    <div id="hud">
        <div id="top-bar" class="interact">
            <div class="panel" id="perf-panel">
                <div id="perf">
                    FPS: <span id="v-fps">0</span> | Sim: <span id="v-sim">0</span>ms | Draw: <span id="v-draw">0</span>ms<br>
                    Pos: <span id="v-pos">0,0</span> | Celdas: <span id="v-cells">0</span><br>
                    Modo: <span id="v-mode">Solo</span>
                </div>
                <div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
            </div>
            <div class="panel" id="mission-panel">
                <div id="score-display">Score: <span id="v-score">0</span></div>
                <div id="mission-display">Misión: Cargando...</div>
            </div>

            <div id="controls-top">
                <button class="btn" id="btn-sound">🔊</button>
                <button class="btn" id="btn-music">🎵</button>
                <button class="btn" id="btn-reset">🌀</button>
                <div id="mp-toggle" class="interact">
                    <button class="btn" id="btn-mp">🎮</button>
                    <div id="mp-panel" class="panel">
                        <h3>🎮 Multijugador</h3>
                        <div class="mp-row">
                            <button class="btn" id="mp-local">👥 Local</button>
                            <button class="btn" id="mp-host">📡 Crear</button>
                            <button class="btn" id="mp-join">🔗 Unirse</button>
                        </div>
                        <textarea id="mp-code" rows="3" placeholder="Codigo de sala..." style="display:none"></textarea>
                        <div class="mp-row" id="mp-actions" style="display:none">
                            <button class="btn" id="mp-copy">📋 Copiar</button>
                            <button class="btn" id="mp-apply">📥 Aplicar</button>
                        </div>
                        <div id="mp-status">Desconectado</div>
                    </div>
                </div>
            </div>
        </div>
        <div id="tutorial">
            <h1>Project Forge 2D</h1>
            <p>🕹 Joystick para moverte • 🖌 Toca para crear • ⛏ Mina • 💣 Explota • 1-9 para materiales</p>
        </div>
        <div id="bottom-bar" class="interact">
            <div id="tools-row">
                <div id="tools"></div>
                <div id="brush-row">
                    <label>Brush</label>
                    <input type="range" id="brush-slider" min="1" max="8" value="3" step="1">
                    <span id="brush-val">3</span>
                </div>
            </div>
            <div id="palette"></div>
        </div>
    </div>

    <script src="js/physics.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/multiplayer.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
