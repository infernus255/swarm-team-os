version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes123}
      POSTGRES_DB: sga
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  sga:
    image: ghcr.io/flowstyleliving/semantic-graph-agent:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-hermes123}@postgres:5432/sga
    volumes:
      - sga-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  hermes:
    build: .
    env_file:
      - hermes.env
    ports:
      - "9119:9119"
      - "8080:8080"
    environment:
      - SGA_URL=http://sga:8000
    volumes:
      # MONTAR TU TRABAJO (read-only para proteger piezas clave, RW para estado)
      - ./harness:/app/harness:ro
      - ./state.json:/app/state.json
      - ./core:/app/core:ro
      - ./swarm:/app/swarm:ro
      - ./app_result:/app/app_result
      # Persistencia de Hermes
      - hermes-memory:/root/.hermes
    depends_on:
      - sga
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  pgdata:
  sga-data:
  hermes-memory:
  n8n-data:
