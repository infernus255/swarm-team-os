version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes123}
      POSTGRES_DB: sga
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  sga:
    image: ghcr.io/flowstyleliving/semantic-graph-agent:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-hermes123}@postgres:5432/sga
    volumes:
      - sga-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  hermes:
    build: .
    env_file:
      - hermes.env
    ports:
      - "9119:9119"
      - "8080:8080"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SGA_URL: http://sga:8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-hermes123}@postgres:5432/sga}
    volumes:
      # MONTAR TU TRABAJO (read-only para proteger piezas clave, RW para estado)
      - .:/app
      - hermes-memory:/root/.hermes
    depends_on:
      - sga
    restart: unless-stopped

volumes:
  pgdata:
  sga-data:
  hermes-memory:
