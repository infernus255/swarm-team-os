version: '3.9'

services:
  hermes:
    build: .
    env_file:
      - hermes.env
    ports:
      - "9119:9119"
      - "8080:8080"
    volumes:
      # MONTAR TU TRABAJO (read-only para proteger piezas clave, RW para estado)
      - .:/app:ro
      - ./state.json:/app/state.json
      - ./app_result:/app/app_result
      # Persistencia de Hermes
      - hermes-memory:/root/.hermes

    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  hermes-memory:
  n8n-data:

