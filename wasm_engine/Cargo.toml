[package]
name = "forge_simulation"
version = "0.1.0"
edition = "2021"
description = "WebAssembly cellular automata physics engine for Project Forge 2D"
authors = ["SwarmTeam OS"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
# Optimize for minimum binary size (critical for in-browser loading)
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
# Fast iteration during development
opt-level = 0
debug = true
